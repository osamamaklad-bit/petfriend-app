<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3031b">
<link rel="icon" href="../icon-192.png">
<title>Pet Friend Today</title>
<script src="../config.js"></script><script src="../i18n.js"></script>
<script src="../settings.js"></script>
<script src="../labels.js"></script>
<style>
  /* "hidden" must always win over a class that sets display (e.g. .ordertitle, .bar, .modes) */
  [hidden] { display: none !important; }
  :root {
    --ink: #2a1417; --paper: #e9fcfd; --card: #ffffff; --line: #b9ecf1; --muted: #6b5f62;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #c00018; --bad-bg: #ffe4e7; --warn: #9a4a00; --accent: #e3031b; --on: #ffffff; --teal: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eaf7f8; --paper: #0f1c1e; --card: #17282b; --line: #27403f; --muted: #8fb0b3;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #ff6b7a; --bad-bg: #3a1218; --warn: #f0a35e; --accent: #ff4a5c; --on: #1a0508; --teal: #5eead4; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; padding: 14px 12px 4px; }
  header .logo { width: 44px; height: 44px; border-radius: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; }
  header h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  header button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 12px 40px; }
  .bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .bar button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; font-size: 15px; }
  #banner { min-height: 40px; display: flex; align-items: center; padding: 8px 14px; border-radius: 10px; font-weight: 600; margin-bottom: 10px;
    background: var(--card); border: 2px solid var(--line); color: var(--muted); }
  #banner.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
  .tile .l { color: var(--muted); font-size: 13px; font-weight: 600; }
  .tile .v { font-size: 30px; font-weight: 800; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile.pos .v { color: var(--accent); } .tile.rcv .v { color: var(--teal); } .tile.err .v { color: var(--ok); } .tile.err.has .v { color: var(--bad); }
  .tile.err.has { border-color: var(--bad); }
  h2 { font-size: 16px; margin: 18px 2px 8px; }
  .err-row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
  .err-row b { color: var(--bad); }
  .err-row .m { color: var(--muted); word-break: break-word; margin-top: 2px; }
  .empty { color: var(--muted); padding: 6px 2px; font-size: 14px; }
  .tile.exp .v { color: var(--warn); } .tile.exp.has { border-color: var(--warn); }
  .tile.bosta.has { border-color: var(--warn); } .tile.bosta.has .s:first-of-type { color: var(--warn); font-weight: 600; }
  .exbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .exbar button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; }
  .exbar button.on { background: var(--warn); border-color: var(--warn); color: var(--on); }
  .exbar label { font-size: 14px; display: flex; align-items: center; gap: 4px; }
  .exbar .sp { flex: 1; }
  #expInfo { color: var(--muted); font-size: 12px; margin: 0 2px 8px; }
  .ex { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .ex img, .ex .noimg { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line); }
  .ex .t { flex: 1; min-width: 0; }
  .ex .t b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex .t small { color: var(--muted); font-size: 12px; }
  .ex .d { text-align: end; font-size: 13px; flex: none; }
  .ex .d b { display: block; font-size: 14px; }
  .ex.past { border-color: var(--bad); } .ex.past .d b { color: var(--bad); }
  .ex.soon .d b { color: var(--warn); }
  .bk .t small { display: block; }
  .bk .d b { color: var(--warn); } .bk.charged .d b { color: var(--bad); }
  @media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } header, main { max-width: 1100px; } }
</style>
</head>
<body>
<header>
  <img class="logo" src="../icon-192.png" alt="Pet Friend">
  <h1>Pet Friend Today<small id="when"></small></h1>
  <button id="settingsBtn">Settings</button>
</header>
<main>
  <div class="bar"><button id="refreshBtn">↻ Refresh</button></div>
  <div id="banner">Today's work in one place.</div>
  <div class="tiles" id="tiles"></div>
  <h2 id="errTitle">Errors today</h2>
  <div id="errors"></div>
  <h2>Bulky shipments — last 14 days</h2>
  <div class="exbar"><span id="bkInfo" class="sp" style="color:var(--muted);font-size:13px"></span><button id="bkCheck">&#8635; Check with Bosta now</button></div>
  <div id="bkJob" class="empty" hidden></div>
  <div id="bkList"><div class="empty">Loading...</div></div>
  <h2>Expiry dates</h2>
  <div class="exbar" id="exbar">
    <button data-d="0">Expired</button><button data-d="30" class="on">30 days</button><button data-d="60">60 days</button><button data-d="90">90 days</button>
    <label><input type="checkbox" id="inStock" checked> In stock only</label>
    <span class="sp"></span>
    <button id="expLabels">Print labels</button>
    <button id="expRefresh">&#8635; Check again</button>
  </div>
  <div id="expInfo"></div>
  <div id="expList"><div class="empty">Loading...</div></div>
</main>
<script>
(function () {
  // Same server and app key as the Orders tab
  const API_URL = window.PF_API_URL;
  const $ = (id) => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let last = null, busy = false;

  function say(msg, kind) { const b = $('banner'); b.className = kind || ''; b.textContent = msg; }
  const isAr = () => window.pfLang && window.pfLang.get() === 'ar';
  const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString(isAr() ? 'ar-EG-u-nu-latn' : [], { hour: '2-digit', minute: '2-digit' }) : '';
  // a time today, or day + time when it was on another day (e.g. a Bosta check that stopped running)
  const fmtWhen = (iso) => { if (!iso) return ''; const d = new Date(iso);
    return d.toDateString() === new Date().toDateString() ? fmtTime(iso)
      : d.toLocaleString(isAr() ? 'ar-EG-u-nu-latn' : [], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
  const money = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

  async function load(quiet) {
    if (busy) return;
    const key = store.get('appKey');
    if (!key) { say('Open Settings and enter the Orders pass.', 'bad'); return; }
    busy = true; if (!quiet) say('Loading...');
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: key, action: 'dailySummary' }) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error === 'Wrong app key' ? 'Wrong Orders pass' : d.error || 'Request failed');
      last = d; render(); say('Updated ' + fmtTime(d.generatedAt));
    } catch (e) { say(e.message, 'bad'); }
    finally { busy = false; }
  }

  function tile(cls, label, value, sub) {
    const t = document.createElement('div'); t.className = 'tile ' + cls;
    const l = document.createElement('div'); l.className = 'l'; l.textContent = label;
    const v = document.createElement('div'); v.className = 'v'; v.textContent = value; v.dir = 'ltr'; v.setAttribute('data-no-i18n', '');
    t.appendChild(l); t.appendChild(v);
    (sub || []).filter(Boolean).forEach(function (x) { const s = document.createElement('div'); s.className = 's'; s.textContent = x; t.appendChild(s); });
    return t;
  }

  function render() {
    if (!last) return;
    // missing parts (e.g. an older server) show as 0 instead of breaking the screen
    const Z = { count: 0, qty: 0 };
    const d = Object.assign({}, last, {
      fulfilled: last.fulfilled || Z, returns: last.returns || Z, pickLists: last.pickLists || Z, photos: last.photos || Z,
      received: Object.assign({ count: 0, qty: 0, extra: 0, rejected: 0, canceled: 0 }, last.received || {}),
      errors: Object.assign({ count: 0, last: [] }, last.errors || {}), generatedAt: last.generatedAt || new Date().toISOString() });
    $('when').textContent = new Date(d.generatedAt).toLocaleDateString(isAr() ? 'ar-EG-u-nu-latn' : [], { weekday: 'long', day: 'numeric', month: 'long' });
    const box = $('tiles'); box.innerHTML = '';
    box.appendChild(d.pos && !d.pos.error
      ? tile('pos', 'POS sales', money(d.pos.total) + ' EGP', [d.pos.count + (d.pos.count === 1 ? ' sale' : ' sales')])
      : tile('pos', 'POS sales', '?', [d.pos && d.pos.error ? 'Could not read POS sales' : '']));
    box.appendChild(tile('', 'Orders fulfilled', String(d.fulfilled.count), [d.fulfilled.qty + ' units']));
    box.appendChild(tile('', 'Open orders', d.openOrders == null ? '?' : String(d.openOrders), ['waiting to be fulfilled']));
    box.appendChild(tile('', 'Returns', String(d.returns.count), [d.returns.qty + ' units']));
    const r = d.received;
    box.appendChild(tile('rcv', 'Received', String(r.qty), [r.count + (r.count === 1 ? ' purchase order' : ' purchase orders'),
      r.extra ? r.extra + ' extra' : '', r.rejected ? r.rejected + ' rejected' : '', r.canceled ? r.canceled + ' cancelled' : '']));
    box.appendChild(tile('', 'Pick lists', String(d.pickLists.count), [d.pickLists.qty + (d.pickLists.qty === 1 ? ' order' : ' orders')]));
    const rp = d.returnPhotos || { count: 0, qty: 0 };
    box.appendChild(tile('', 'Shipment photos', String(d.photos.qty), [d.photos.count + (d.photos.count === 1 ? ' shipment' : ' shipments'),
      rp.qty ? rp.qty + (rp.qty === 1 ? ' return photo' : ' return photos') : '']));
    box.appendChild(tile('err' + (d.errors.count ? ' has' : ''), 'Errors today', String(d.errors.count), [d.errors.count ? 'see the list below' : 'all good']));
    // Bosta bulky check (hourly): is it running, and what did it find today
    const bo = d.bosta || {}, lb = bo.last, bk = d.bulky || { count: 0 };
    const age = lb && lb.at ? (Date.now() - new Date(lb.at).getTime()) / 36e5 : null;
    const bad = bo.trigger === false || age == null || age > 2 || (lb && lb.failed > 0);
    box.appendChild(tile('bosta' + (bad ? ' has' : ''), 'Bulky shipments today', String(bk.count), [
      bo.trigger === false ? 'Hourly Bosta check is off' : '',
      lb && lb.at ? 'Last Bosta check ' + fmtWhen(lb.at) : 'Bosta check never ran',
      lb ? lb.checked + (lb.checked === 1 ? ' shipment checked' : ' shipments checked') : '',
      lb && lb.failed ? lb.failed + ' failed' : '',
      bo.open != null ? bo.open + ' shipments followed' : '']));
    expTile();
    const eb = $('errors'); eb.innerHTML = '';
    if (!d.errors.last.length) { eb.innerHTML = '<div class="empty">No errors today.</div>'; return; }
    d.errors.last.forEach(function (x) {
      const row = document.createElement('div'); row.className = 'err-row';
      const h = document.createElement('div'); const b = document.createElement('b');
      b.textContent = fmtTime(x.time) + ' · '; h.appendChild(b);
      const what = document.createElement('span'); what.textContent = x.part + (x.action ? ' / ' + x.action : ''); what.dir = 'ltr'; what.setAttribute('data-no-i18n', '');
      h.appendChild(what);
      const m = document.createElement('div'); m.className = 'm'; m.textContent = x.message; m.dir = 'ltr'; m.setAttribute('data-no-i18n', '');
      row.appendChild(h); row.appendChild(m); eb.appendChild(row);
    });
  }

  // ---------- expiry dates (product custom.expiry_date): expired and coming up ----------
  let exp = null, expBusy = false, expDays = 30;
  try { expDays = +(localStorage.getItem('pf_exp_days') || 30); } catch (e) {}
  function expRows() {
    if (!exp) return [];
    const inStock = $('inStock').checked;
    return exp.items.filter(function (x) { return (expDays === 0 ? x.daysLeft < 0 : x.daysLeft <= expDays) && (!inStock || x.stock > 0); });
  }
  function expTile() {
    const box = $('tiles'); if (!box.childNodes.length) return;
    const old = box.querySelector('.tile.exp'); if (old) old.remove();
    if (!exp) return;
    const past = exp.items.filter(function (x) { return x.daysLeft < 0 && x.stock > 0; }).length;
    const soon = exp.items.filter(function (x) { return x.daysLeft >= 0 && x.daysLeft <= 30 && x.stock > 0; }).length;
    box.appendChild(tile('exp' + (past + soon ? ' has' : ''), 'Expiring in 30 days', String(soon), [past ? past + ' expired in stock' : 'none expired in stock']));
  }
  function renderExp() {
    document.querySelectorAll('#exbar button[data-d]').forEach(function (b) { b.classList.toggle('on', +b.dataset.d === expDays); });
    const list = $('expList'); list.innerHTML = '';
    expTile();
    if (!exp) return;
    $('expInfo').textContent = 'Checked ' + exp.scanned + ' products, ' + exp.withDate + ' with an expiry date' + (exp.truncated ? ' (list cut short)' : '') + ' · ' + fmtTime(exp.generatedAt);
    const rows = expRows();
    if (!rows.length) { list.innerHTML = '<div class="empty">' + (expDays === 0 ? 'Nothing expired.' : 'Nothing expires in this period.') + '</div>'; return; }
    rows.forEach(function (x) {
      const el = document.createElement('div'); el.className = 'ex' + (x.daysLeft < 0 ? ' past' : x.daysLeft <= 30 ? ' soon' : '');
      const im = x.image ? document.createElement('img') : document.createElement('div');
      if (x.image) { im.src = x.image; im.alt = ''; } else im.className = 'noimg';
      const t = document.createElement('div'); t.className = 't';
      const b = document.createElement('b'); b.textContent = x.title; b.setAttribute('data-no-i18n', ''); b.dir = 'auto';
      const sm = document.createElement('small'); sm.dir = 'ltr'; sm.setAttribute('data-no-i18n', '');
      sm.textContent = [x.sku && 'SKU ' + x.sku, x.bin && 'Bin ' + x.bin].filter(Boolean).join(' · ');
      const st = document.createElement('small'); st.textContent = ' ' + (x.stock + ' in stock');
      t.appendChild(b); t.appendChild(sm); t.appendChild(st);
      const d = document.createElement('div'); d.className = 'd';
      const db = document.createElement('b');
      db.textContent = x.daysLeft < 0 ? 'Expired ' + (-x.daysLeft) + (x.daysLeft === -1 ? ' day ago' : ' days ago') : x.daysLeft === 0 ? 'Expires today' : x.daysLeft + (x.daysLeft === 1 ? ' day left' : ' days left');
      const dd = document.createElement('span'); dd.textContent = x.expiry; dd.dir = 'ltr'; dd.setAttribute('data-no-i18n', '');
      d.appendChild(db); d.appendChild(dd);
      el.appendChild(im); el.appendChild(t); el.appendChild(d); list.appendChild(el);
    });
  }
  async function loadExp(refresh) {
    if (expBusy) return;
    const key = store.get('appKey'); if (!key) return;
    expBusy = true;
    if (refresh || !exp) { $('expList').innerHTML = '<div class="empty">Checking expiry dates...</div>'; }
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: key, action: 'expiryReport', refresh: !!refresh }) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error === 'Wrong app key' ? 'Wrong Orders pass' : d.error || 'Request failed');
      if (!Array.isArray(d.items)) throw new Error('Could not read expiry dates');
      exp = d; renderExp();
    } catch (e) { $('expList').innerHTML = ''; const m = document.createElement('div'); m.className = 'empty'; m.textContent = e.message; $('expList').appendChild(m); }
    finally { expBusy = false; }
  }
  $('exbar').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    expDays = +b.dataset.d; try { localStorage.setItem('pf_exp_days', String(expDays)); } catch (x) {}
    renderExp();
  });
  $('inStock').addEventListener('change', renderExp);
  $('expRefresh').addEventListener('click', function () { loadExp(true); });
  $('expLabels').addEventListener('click', function () {
    const rows = expRows(); if (!rows.length) return;
    pfLabels.open(rows.map(function (x) { return { title: x.title, barcode: x.barcode || '', sku: x.sku || '', binVariant: x.binVariant || '', binProduct: x.binProduct || '', bin: x.bin || '', expiry: x.expiry, copies: x.stock }; }),
      { name: 'expiry', save: async function (pdf, fileName, count) {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: store.get('appKey'), action: 'saveLabels', pdf: pdf, name: fileName, count: count, where: 'today' }) });
        const d = await res.json(); if (!d.ok) throw new Error(d.error || 'Request failed'); return d;
      } }).then(function (r) { if (r && r.url) say('Labels saved to Google Drive: ' + r.name); });
  });

  // ---------- bulky shipments of the last 14 days ----------
  let bk = null, bkBusy = false, bkPoll = null;
  const T = (x) => (window.pfT ? window.pfT(x) : x);
  function srcText(x) { return !x ? '?' : x.error ? T('error') + ' (' + x.error + ')' : x.skipped ? T('not set up') : (x.found || 0) + ' ' + T('numbers') + ', ' + (x.added || 0) + ' ' + T('new'); }
  function renderJob() {
    const j = bk && bk.job, el = $('bkJob');
    el.hidden = !j;
    if (!j) return;
    if (j.state === 'running') { el.textContent = T('Bosta check running since') + ' ' + fmtWhen(j.startedAt) + ' · ' + j.checked + ' ' + T('shipments checked so far'); $('bkCheck').disabled = true; return; }
    $('bkCheck').disabled = bkBusy;
    const s = j.sources || {};
    el.textContent = (j.state === 'failed' ? T('Last check failed:') + ' ' + (j.error || '') : T('Last check') + ' ' + fmtWhen(j.updatedAt) + ' · ' + j.checked + ' ' + T('shipments checked')) +
      ' — ' + T('Bosta list') + ': ' + srcText(s.bosta) + ' · ' + T('Wallet feed') + ': ' + srcText(s.fees) + ' · ' + T('Shopify') + ': ' + srcText(s.shopify);
  }
  function renderBulky() {
    const box = $('bkList'); box.innerHTML = '';
    renderJob();
    if (!bk) return;
    $('bkInfo').textContent = bk.count ? bk.count + (bk.count === 1 ? ' shipment' : ' shipments') + ' · ' + money(bk.fees) + ' EGP' : '';
    if (!bk.items.length) { box.innerHTML = '<div class="empty">No bulky shipments in the last 14 days.</div>'; return; }
    bk.items.forEach(function (x) {
      const el = document.createElement('div'); el.className = 'ex bk' + (x.final != null ? ' charged' : '');
      const t = document.createElement('div'); t.className = 't';
      const b = document.createElement('b'); b.textContent = x.tn + (x.order ? ' · ' + x.order : ''); b.dir = 'ltr'; b.setAttribute('data-no-i18n', ''); t.appendChild(b);
      const sm = document.createElement('small'); sm.textContent = [x.size, x.state].filter(Boolean).join(' · '); sm.dir = 'ltr'; sm.setAttribute('data-no-i18n', ''); t.appendChild(sm);
      if (x.items) { const it = document.createElement('small'); it.textContent = x.items.split('\n')[0]; it.dir = 'auto'; it.setAttribute('data-no-i18n', ''); t.appendChild(it); }
      const d = document.createElement('div'); d.className = 'd';
      const fee = document.createElement('b'); fee.textContent = money(x.final != null ? x.final : x.expected) + ' EGP';
      const st = document.createElement('span'); st.textContent = x.final != null ? 'Charged' : 'Expected';
      const dt = document.createElement('div'); dt.textContent = x.date; dt.dir = 'ltr'; dt.setAttribute('data-no-i18n', '');
      d.appendChild(fee); d.appendChild(st); d.appendChild(dt);
      el.appendChild(t); el.appendChild(d); box.appendChild(el);
    });
  }
  async function loadBulky(check) {
    if (bkBusy) return;
    const key = store.get('appKey'); if (!key) return;
    bkBusy = true; $('bkCheck').disabled = true;
    const wasRunning = bk && bk.job && bk.job.state === 'running';
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ key: key, action: check ? 'bulkyCheck' : 'bulkyList', days: 14 }) });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error === 'Wrong app key' ? 'Wrong Orders pass' : d.error || 'Request failed');
      bk = d;
      if (check) say(d.already ? 'A Bosta check is already running. The list updates by itself.' : 'Bosta check started. It runs in the background (a few minutes); the list updates by itself and the result goes to the Telegram group.', 'ok');
      else if (wasRunning && d.job && d.job.state === 'done') say('Bosta check done: ' + d.job.checked + ' shipments checked, ' + d.count + ' bulky.', 'ok');
    } catch (e) { $('bkList').innerHTML = ''; const m = document.createElement('div'); m.className = 'empty'; m.textContent = e.message; $('bkList').appendChild(m); }
    finally {
      bkBusy = false; renderBulky();
      // while the job runs: look again every 30 seconds
      clearTimeout(bkPoll);
      if (bk && bk.job && bk.job.state === 'running') bkPoll = setTimeout(function () { loadBulky(); }, 30000);
    }
  }
  $('bkCheck').addEventListener('click', async function () {
    if (!(await pfConfirm(T('Bring in the Bosta shipments of the last 14 days and check their size now? It runs in the background and can take several minutes.'), { ok: 'Check now' }))) return;
    loadBulky(true);
  });

  $('refreshBtn').addEventListener('click', function () { load(); loadBulky(); });
  $('settingsBtn').addEventListener('click', async function () {
    const v = await pfSettings({ title: 'Settings', fields: [{ key: 'appKey', label: 'Orders pass', hint: 'The same pass opens Orders, Check, Purchase orders, Pick list and Today.', secret: true, value: store.get('appKey') }] });
    if (v) { store.set('appKey', v.appKey); load(); loadExp(); loadBulky(); }
  });
  document.addEventListener('pf-lang', function () { render(); renderExp(); renderBulky(); });
  // refresh when the tab is opened again, and every 2 minutes while it is visible
  // (a tab hidden inside the app still counts as visible to the browser, so the main page tells us)
  let shown = true;
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (e.data === 'pf-hide') shown = false;
    if (e.data === 'pf-show') { shown = true; load(true); loadExp(); loadBulky(); }
  });
  setInterval(function () { if (shown && !document.hidden && store.get('appKey')) load(true); }, 120000);
  load(); loadExp(); loadBulky();
})();
</script>
</body>
</html>

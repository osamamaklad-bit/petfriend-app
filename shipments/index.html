<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pet Friend Shipments</title><script src="../config.js"></script><script src="../i18n.js"></script><script src="../settings.js"></script><link rel="icon" href="../icon-192.png"><meta name="theme-color" content="#e3031b"><meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#e9fcfd;--ink:#2a1417;--mut:#6b5f62;--card:#fff;--line:#b9ecf1;--acc:#e3031b;--on:#fff;--warn:#9a4a00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c1e;--ink:#eaf7f8;--mut:#8fb0b3;--card:#17282b;--line:#27403f;--acc:#ff4a5c;--on:#1a0508;--warn:#f0a35e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:12px}.tabs{display:flex;gap:8px;margin-bottom:12px}
button,input{font:inherit;border-radius:8px;border:1px solid var(--line);padding:12px;background:var(--card);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.tabs button{flex:1}.tabs .on{border-color:var(--acc);color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;margin:8px 0}.row input{flex:1;min-width:0}input#tn{font-size:20px;letter-spacing:1px}
#reader{width:100%}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.thumbs img,.ph img{width:100%;border-radius:6px;display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.msg{margin:8px 0;color:var(--mut)}.bad{color:var(--warn)}.tag{font-weight:700;color:var(--warn)}pre{white-space:pre-wrap;margin:6px 0;font:inherit}
.hide{display:none}
.lchips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.lchips button{padding:6px 12px;border-radius:99px;font-size:14px}.lchips .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.lg .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.lg .h b{font-size:17px;letter-spacing:.5px}
.lg .s{color:var(--mut);font-size:13px;margin-top:2px}.lg .n{font-weight:700;color:var(--acc);white-space:nowrap;font-size:13px}
.lg .ims{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.lg .ims img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.retnote{background:#fff7ed;border:2px solid #c2410c;color:#9a3412;border-radius:10px;padding:10px 12px;font-weight:600;margin-bottom:8px}
body.ret .tabs #t3.on{border-color:#c2410c;color:#c2410c}body.ret button.p{background:#c2410c;border-color:#c2410c}
.rtag{display:inline-block;background:#c2410c;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-end:6px}
@media (prefers-color-scheme:dark){.retnote{background:#2a1508;color:#fdba74;border-color:#fb923c}}
@media (min-width:900px){
  body{max-width:1100px;padding:20px}
  #login{max-width:420px;margin:40px auto}
  .tabs{max-width:480px}
  #v1>.row,#v1>#note,#v1>#force,#v1>#oRow{max-width:640px}
  #reader{max-width:560px}
  .thumbs{grid-template-columns:repeat(6,1fr)}
  #v2>.row{max-width:640px}
  #res{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
  #res .card{margin:0}
  #res>.card:first-child{grid-column:1/-1}
}

  <div id="retNote" class="retnote hide">Return shipment: scan the label of the package that came back, then photograph it.</div>
  <div class="row"><button id="oBtn" style="flex:1;font-size:14px;padding:8px" onclick="setOther(!other)">Other carrier / no tracking</button></div>

    <div class="row"><input id="car" list="cars" placeholder="Carrier (Aramex, J&amp;T, courier...)"><datalist id="cars"><option>Aramex</option><option>J&amp;T</option><option>Mylerz</option><option>R2S</option><option>Private courier</option></datalist></div>
    <div class="row"><input id="ref" placeholder="Reference (empty = auto code)" oninput="this.value=this.value.toUpperCase().replace(/\s+/g,'')"><button onclick="scan('ref')">Scan</button></div>
  </div>
  <div class="row" id="bRow"><input id="tn" inputmode="numeric" placeholder="Last 10 digits of barcode" oninput="this.value=this.value.replace(/\D/g,'').slice(-10)" onkeydown="if(event.key==='Enter')snap.click()"><button onclick="scan()">Scan</button></div>

</div>

  <div class="row"><input id="lq" placeholder="Tracking number or order" oninput="this.value=this.value.toUpperCase().replace(/\s+/g,'')" onkeydown="if(event.key==='Enter')loadLog()"><button onclick="loadLog()">↻</button></div>

<script>
const API_URL=window.PF_API_URL;
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn,args})}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j.result})}
const google={script:{get run(){let ok=()=>{},bad=()=>{};const o=new Proxy({},{get:(_,k)=>k==='withSuccessHandler'?f=>(ok=f,o):k==='withFailureHandler'?f=>(bad=f,o):(...a)=>{api(k,a).then(ok).catch(bad)}});return o}}};
// Inside the PetFriend app: stop the camera when the user switches to another tab
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='pf-hide'&&qr){try{qr.stop().then(()=>qr.clear()).catch(()=>{})}catch(err){}}});
</script>
<script>
let pin='', photos=[], qr=null, busy=false, pending=[], lastTn='', lastAt=0, camMode=false, other=false, ret=false; try{pin=localStorage.getItem('pfs_pin')||''}catch(e){}
const $=id=>document.getElementById(id), say=(t,bad)=>{$('msg').textContent=t;$('msg').className='msg'+(bad?' bad':'')};
function boot(){ if(pin) google.script.run.withFailureHandler(fail).checkPin(pin); else say('Open Settings and enter the Shipments pass.',true) }
function lock(){pin='';try{localStorage.removeItem('pfs_pin')}catch(e){}}
async function settings(){ const v=await pfSettings({title:'Settings',fields:[{key:'pin',label:'Shipments pass',hint:'The same pass opens Shipments and Return shipments.',secret:true,numeric:true,value:pin}]}); if(!v) return;
  pin=v.pin; try{localStorage.setItem('pfs_pin',pin)}catch(e){} say(''); boot() }
// 1 = Save (outgoing), 3 = Returns (same screen, saved as a return), 2 = Search, 4 = Log (photos of a period)
function tab(n){ ret=n===3||(n===4&&ONLY_RETURNS); document.body.classList.toggle('ret',ret); $('retNote').classList.toggle('hide',n!==3);
  $('v1').classList.toggle('hide',n===2||n===4); $('v2').classList.toggle('hide',n!==2); $('v4').classList.toggle('hide',n!==4);
  [1,2,3,4].forEach(i=>$('t'+i).classList.toggle('on',i===n));
  if(n===4) loadLog();
  $('force').classList.add('hide'); $('th').innerHTML=''; lastTn=''; say('') }
function fail(e){say(e.message||String(e),true);busy=false;if(/PIN/.test(e.message||'')){lock();say('Wrong Shipments pass. Open Settings and enter it again.',true)}}
function shrink(file){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=URL.createObjectURL(file)})}
async function addPhotos(fs){
  const list=[];
  for(const f of fs){ list.push(await shrink(f));
    if(!other&&$('tn').value.length<10){ try{ const r=new Html5Qrcode('reader'); const t=await r.scanFile(f,false); $('tn').value=t.replace(/\D/g,'').slice(-10); r.clear() }catch(e){} } }
  $('snap').value=''; $('th').innerHTML=list.map(p=>'<img src="'+p+'">').join('');
  if(other) return saveOther(list);
  if($('tn').value.length<10) return say('Scan or type the tracking number, then take the photo',true);
  autoSave(list);
}
function frame(){
  const v=document.querySelector('#reader video'); if(!v||!v.videoWidth) return null;
  const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
  c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)
}
async function scan(target){
  const el=$(target||'tn'); say('Point the camera at the barcode...'); camMode=!target;
  let cand='', hits=0, done=false;
  try{ qr=new Html5Qrcode('reader'); await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:120}},async t=>{
      if(done) return;
      const txt=t.trim().toUpperCase().replace(/\s+/g,''), raw=txt.replace(/\D/g,''); let tn;
      if(target==='ref'){ if(txt.length<3) return; tn=txt }                 // other carrier: any barcode text
      else if(raw.length>=10) tn=raw.slice(-10);                              // Bosta: last 10 digits
      else if(target==='q'&&txt.length>=3) tn=txt;
      else return;
      if(!target&&tn===lastTn&&Date.now()-lastAt<8000){ say(tn+' just handled. Move to the next label.',true); return }
      if(tn!==cand){ cand=tn; hits=1; return }                           // need the same number 3 reads in a row
      if(++hits<3) return;
      done=true; const shot=frame();
      try{await qr.stop();qr.clear()}catch(e){}
      el.value=tn; if(target==='q') return find();
      if(target==='ref') return say('Got '+tn+'. Now take the photo.');
      if(shot){$('th').innerHTML='<img src="'+shot+'">';autoSave([shot])} else snap.click();
  }) }
  catch(e){ say('Camera blocked here. Type the number or take a photo of the label instead.',true) }
}
function setOther(on){ other=on; $('bRow').classList.toggle('hide',on); $('oRow').classList.toggle('hide',!on); $('force').classList.add('hide');
  $('oBtn').classList.toggle('on',on); $('oBtn').textContent=on?'Back to Bosta':'Other carrier / no tracking'; $('th').innerHTML=''; say('');
  if(on&&!$('car').value) try{$('car').value=localStorage.getItem('pfs_car')||''}catch(e){} }
function saveOther(list){
  const car=$('car').value.trim(); if(busy) return; if(!car) return say('Choose the carrier first',true);
  try{localStorage.setItem('pfs_car',car)}catch(e){}
  busy=true; say('Saving...');
  google.script.run.withSuccessHandler(r=>{ busy=false; $('ref').value=''; $('note').value=''; $('th').innerHTML='';
    $('msg').innerHTML=(ret?'Return saved: ':'Saved ')+r.saved+' photo(s) · '+car+'<br><b style="font-size:22px;color:var(--ink)">'+esc(r.ref)+'</b>'; $('msg').className='msg';
  }).withFailureHandler(fail).saveOther(pin,car,$('ref').value,list,$('note').value,ret)
}
function autoSave(list,force){
  const tn=$('tn').value.trim(); if(busy||tn.length<10) return;
  busy=true; pending=list; $('force').classList.add('hide'); say('Saving '+tn+'...');
  google.script.run.withSuccessHandler(r=>{ busy=false; lastTn=tn; lastAt=Date.now();
    if(r.duplicate){ say((ret?'Return '+tn+' is already saved (':tn+' is already saved (')+r.at+'). Not duplicated.',true); $('force').classList.remove('hide') }
    else { say((ret?'Return saved: ':'Saved ')+tn+(camMode?'. Scan the next one...':'')); pending=[]; $('tn').value=''; $('note').value=''; $('th').innerHTML=''; if(camMode) scan() }
  }).withFailureHandler(fail)[ret?'saveReturn':'saveShipment'](pin,tn,list,$('note').value,!!force)
}
function find(){
  const tn=$('q').value.trim(); if(!tn) return; say('Searching...'); $('res').innerHTML='';
  google.script.run.withSuccessHandler(r=>{ say('');
    if(!r.photos.length&&!r.state) return say('Nothing saved for '+tn,true);
    const b=r.bulky, h='<div class="card">'+(r.returned?'<span class="rtag">Returned</span>':'')+'<b>'+esc(r.tn)+'</b><div class="msg">'+esc(r.carrier&&r.carrier!=='Bosta'?r.carrier:(r.state||'Not synced with Bosta yet')+(r.size?' · size '+r.size:''))+'</div>'+
      (b?'<div class="tag">'+esc(b.size+' · '+b.status+' · '+(b.final||b.expected)+' EGP')+'</div><pre>'+esc(b.items)+'</pre>':'')+'</div>';
    $('res').innerHTML=h+r.photos.map(p=>'<div class="ph card"><img src="'+(/^data:image\//.test(p.img)?esc(p.img):'')+'"><div class="msg">'+(p.ret?'<span class="rtag">Return photo</span>':'')+esc(p.time+(p.note?' · '+p.note:''))+'</div></div>').join('')
  }).withFailureHandler(fail).getShipment(pin,tn)
}
// ---------- Log: the shipments photographed in a period (Shipments: outgoing, Return shipments: returns) ----------
let logPer='today', logData=null;
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=x=>window.pfT?pfT(x):x;
$('lPer').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b)return;logPer=b.dataset.p;
  [...$('lPer').children].forEach(x=>x.classList.toggle('on',x===b));loadLog()});
function loadLog(){
  if(!pin) return say('Open Settings and enter the Shipments pass.',true);
  $('lList').innerHTML='<div class="msg">'+esc(T('Loading...'))+'</div>'; $('lSum').textContent='';
  google.script.run.withSuccessHandler(r=>{ logData=r; drawLog() }).withFailureHandler(e=>{$('lList').innerHTML='';fail(e)})
    .getShipmentLog(pin,logPer,ONLY_RETURNS?'ret':'out',$('lq').value)
}
function drawLog(){
  const r=logData; if(!r) return;
  $('lSum').textContent=r.total+(r.total===1?' shipment':' shipments')+' · '+r.photos+(r.photos===1?' photo':' photos');
  if(!r.items.length){ $('lList').innerHTML='<div class="msg">'+esc(T('No photos in this period.'))+'</div>'; return }
  $('lList').innerHTML=r.items.map((x,i)=>'<div class="lg" data-i="'+i+'"><div class="h"><b dir="ltr" data-no-i18n>'+esc(x.tn)+'</b><span class="n" data-no-i18n dir="ltr">📷 '+x.count+'</span></div>'+
    '<div class="s"><span dir="ltr" data-no-i18n>'+esc(x.first===x.last?x.first:x.first+' → '+x.last.slice(11))+'</span> · <span data-no-i18n dir="auto">'+esc(x.carrier)+'</span>'+
    (x.notes.length?' · <span data-no-i18n dir="auto">'+esc(x.notes.join(' · '))+'</span>':'')+(x.by.length?' · <span data-no-i18n dir="ltr">'+esc(x.by.join(', '))+'</span>':'')+'</div><div class="ims"></div></div>').join('')
}
$('lList').addEventListener('click',e=>{
  if(e.target.closest('a')) return;
  const c=e.target.closest('.lg'); if(!c) return;
  const box=c.querySelector('.ims'); if(box.childElementCount){ box.innerHTML=''; return }
  const x=logData.items[+c.dataset.i]; box.innerHTML='<div class="msg">'+esc(T('Loading...'))+'</div>';
  google.script.run.withSuccessHandler(ps=>{ box.innerHTML=ps.filter(p=>p.thumb).map(p=>'<a href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+(/^data:image\//.test(p.thumb)?esc(p.thumb):'')+'" alt=""></a>').join('') })
    .withFailureHandler(e=>{box.innerHTML='';fail(e)}).getShipmentThumbs(pin,x.files)
});
document.addEventListener('pf-lang',drawLog);

// The main page has two tabs on this page: Shipments (outgoing: Save + Search) and Return shipments
// (shipments/index.html?only=returns: Return + Search). Each keeps to its own kind.
const ONLY_RETURNS=/[?&]only=returns\b/.test(location.search);
if(ONLY_RETURNS){ $('t1').classList.add('hide'); $('t3').classList.remove('hide'); $('pageTitle').textContent='Return shipments'; document.title='Pet Friend Return Shipments'; tab(3) }
boot();
</script></body></html>

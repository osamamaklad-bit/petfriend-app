<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3031b">
<link rel="icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PF Orders">
<title>Pet Friend Orders</title>
<script src="../config.js"></script><script src="../i18n.js"></script>
<script src="../settings.js"></script>
<script src="../labels.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  /* Pet Friend brand: same palette as the Shipments and POS tabs */
  :root {
    --ink: #2a1417;
    --paper: #e9fcfd;
    --card: #ffffff;
    --line: #b9ecf1;
    --muted: #6b5f62;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --warn: #9a4a00;
    --warn-bg: #fef3c7;
    --bad: #c00018;
    --bad-bg: #ffe4e7;
    --accent: #e3031b;
    --on: #ffffff;
    --soft: #f1fdfe;
    --done-bg: #f3fbf5;
    --ret: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eaf7f8; --paper: #0f1c1e; --card: #17282b; --line: #27403f; --muted: #8fb0b3;
      --ok: #4ade80; --ok-bg: #12301f; --warn: #f0a35e; --warn-bg: #3a2610; --bad: #ff6b7a; --bad-bg: #3a1218;
      --accent: #ff4a5c; --on: #1a0508; --soft: #1d3236; --done-bg: #132b20; --ret: #f0a35e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper); color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
  }
  header { display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; padding: 14px 12px 4px; }
  header .logo { width: 44px; height: 44px; border-radius: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; }
  header h1 small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  header h1 small .ver { font-weight: 400; color: var(--muted); }
  body.ret header h1 #modeLabel { color: var(--ret); }
  header button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; font: inherit; font-size: 13px; }
  main { padding: 12px 12px 140px; max-width: 640px; margin: 0 auto; }

  .orderbar { display: flex; gap: 8px; margin-bottom: 10px; }
  .orderbar input {
    flex: 1; min-width: 0; padding: 12px; font-size: 18px; border: 2px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink);
  }
  button.primary {
    background: var(--accent); color: var(--on); border: 0; border-radius: 10px;
    padding: 12px 16px; font-size: 16px; font-weight: 600;
  }
  button.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; font-weight: 600; }
  button:disabled { opacity: .45; }

  #camwrap { background: #000; border-radius: 12px; overflow: hidden; margin: 0 auto 10px; display: none; max-width: 480px; }
  #camwrap.on { display: block; }
  #camwrap { position: relative; }
  #camMsg { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 10px 12px; border-radius: 10px; font-weight: 700; font-size: 16px; white-space: pre-line;
    background: rgba(0,0,0,.72); color: #fff; z-index: 5; text-align: center; }
  #camMsg.ok { background: rgba(21,128,61,.92); }
  #camMsg.warn { background: rgba(180,83,9,.92); }
  #camMsg.bad { background: rgba(185,28,28,.92); }
  .item.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--ok); } 100% { box-shadow: 0 0 0 0 transparent; } }
  #reader { width: 100%; }
  #reader video { object-fit: cover; }

  #banner {
    white-space: pre-line;
    min-height: 52px; display: flex; align-items: center; padding: 10px 14px; border-radius: 10px;
    font-weight: 600; margin-bottom: 10px; background: var(--card); border: 2px solid var(--line); color: var(--muted);
  }
  #banner.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  #banner.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  #banner.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

  .ordertitle { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 8px; }
  .ordertitle strong { font-size: 20px; }
  .ordertitle span { color: var(--muted); font-size: 14px; }
  #labelsBtn { width: 100%; margin: 0 0 8px; }

  .item {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center;
    background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px;
  }
  .item.part { border-color: var(--warn); }
  .item.done { border-color: var(--ok); background: var(--done-bg); }
  .item img, .item .noimg { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--soft); }
  .item .t { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .item .m { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .item .bin { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 13px; }
  .item .bin span { color: var(--muted); }
  .item .bin b { color: var(--rcv); font-size: 14px; }
  .item .bin b.expired { color: var(--bad); }
  .item.over { border-color: var(--warn); }
  .item.over .n { color: var(--warn); }
  .count .xtra { color: var(--warn); font-size: 11px; font-weight: 700; }
  .item .rc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .item .rc > div { display: flex; align-items: center; gap: 5px; }
  .item .rc button { width: 26px; height: 24px; border: 1px solid var(--line); background: var(--card); border-radius: 6px; font-size: 15px; line-height: 1; color: var(--ink); padding: 0; }
  .item .rc button.locked { opacity: .35; }
  .item .rc b { min-width: 14px; text-align: center; color: var(--ink); }
  .item .rc b.on { color: var(--bad); }
  .item .nobc { color: var(--bad); font-weight: 700; font-size: 12px; margin-top: 3px; }
  .item .bin .edit { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 2px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .count { text-align: center; }
  .count .n { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .item.done .n { color: var(--ok); }
  .item.part .n { color: var(--warn); }
  .adj { display: flex; gap: 6px; margin-top: 4px; }
  .adj button { width: 34px; height: 30px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 18px; line-height: 1; color: var(--ink); }
  .adj button.locked { opacity: .35; }
  .item .lockhint { color: var(--muted); font-size: 11px; margin-top: 3px; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  footer .row { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  footer label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #fulfillBtn { flex: 1; padding: 16px; font-size: 18px; background: var(--accent); }
  #fulfillBtn:disabled { background: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 28px 8px; }

  .chips { display: flex; gap: 8px; margin: 0 0 10px; flex-wrap: wrap; }
  .chips button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: var(--on); }
  .ord { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: start;
    background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; color: var(--ink); font: inherit; }
  .ord .a { font-weight: 800; font-size: 18px; }
  .ord .b { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ord .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .pill.u { background: var(--bad-bg); color: var(--bad); }
  .pill.p { background: var(--warn-bg); color: var(--warn); }
  .pill.o { background: var(--soft); color: var(--muted); }
  .ord .q { text-align: end; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .ord .q b { display: block; font-size: 20px; color: var(--ink); }

  /* ---------- mode switch (fulfill / returns) ---------- */
  .modes { display: flex; gap: 4px; padding: 4px; margin-bottom: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; }
  .modes button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 10px; border-radius: 8px; font-size: 16px; font-weight: 700; }
  .modes button.on { background: var(--accent); color: var(--on); }
  body.ret .modes button.on { background: var(--ret); }
  body.ret #fulfillBtn { background: var(--ret); }
  body.ret #fulfillBtn:disabled { background: var(--muted); }
  .retopts { display: none !important; margin-bottom: 8px; }
  body.ret .retopts { display: flex !important; }
  .retopts select { flex: 1; min-width: 0; padding: 10px; font-size: 15px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  body.ret main { padding-bottom: 200px; }
  /* receive (from suppliers) */
  :root { --rcv: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --rcv: #5eead4; } }
  body.rcv header h1 #modeLabel { color: var(--rcv); }
  body.rcv .modes button.on { background: var(--rcv); color: var(--on); }
  body.rcv #fulfillBtn { background: var(--rcv); color: var(--on); }
  body.rcv #fulfillBtn:disabled { background: var(--muted); }
  body.rcv #notifyLbl, body.rcv #chips button[data-f] { display: none; }

  /* ---------- computer / tablet ---------- */
  @media (min-width: 900px) {
    header, main, footer .row { max-width: 1180px; }
    main { padding: 12px 20px 110px; }
    header { padding: 18px 20px 6px; }
    .modes { max-width: 420px; }
    .orderbar { max-width: 720px; }
    #camwrap { margin-left: 0; }
    #orderList, #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
    #orderList .ord, #list .item { margin-bottom: 0; }
    #orderList .empty, #list .empty { grid-column: 1 / -1; }
    footer .row { padding: 0 8px; }
    #fulfillBtn { flex: 0 1 360px; margin-left: auto; }
    .retopts select { flex: 0 1 360px; }
    body.ret main { padding-bottom: 170px; }
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="../icon-192.png" alt="Pet Friend">
  <h1>Pet Friend Orders<small><span id="modeLabel">Fulfill</span> <span class="ver" data-no-i18n>· app 2026-11-21.1</span></small></h1>
  <button id="settingsBtn">Settings</button>
</header>

<main>
  <div class="modes" id="modes">
    <button data-m="fulfill" class="on">Fulfill</button>
    <button data-m="return">Returns</button>
    <button data-m="receive">Receive</button>
  </div>

  <div class="orderbar">
    <input id="orderInput" inputmode="numeric" placeholder="Order number" autocomplete="off">
    <button class="primary" id="loadBtn">Load</button>
    <button class="ghost" id="camBtn">Camera</button>
  </div>

  <div id="camwrap"><div id="reader"></div><div id="camMsg" hidden></div></div>
  <div id="banner">Pick an order, scan its barcode, or type the number.</div>

  <div id="openOrders">
    <div class="ordertitle"><strong id="listTitle">Open orders</strong><span id="ordersCount"></span></div>
    <div class="chips" id="chips">
      <button data-f="all" class="on">All</button>
      <button data-f="UNFULFILLED">Unfulfilled</button>
      <button data-f="PARTIALLY_FULFILLED">Partial</button>
      <button id="refreshBtn" aria-label="Refresh">&#8635; Refresh</button>
    </div>
    <div id="orderList"></div>
  </div>

  <div id="orderTitle" class="ordertitle" hidden>
    <strong id="orderName"></strong><span id="orderSummary"></span>
  </div>
  <button class="ghost" id="labelsBtn" hidden>Print labels</button>
  <div id="list"></div>
</main>

<footer>
  <div class="row retopts">
    <select id="reason" aria-label="Return reason">
      <option value="UNKNOWN">Reason: not given</option>
      <option value="UNWANTED">Customer changed their mind</option>
      <option value="DEFECTIVE">Damaged or defective</option>
      <option value="WRONG_ITEM">Wrong item sent</option>
      <option value="NOT_AS_DESCRIBED">Not as described</option>
      <option value="SIZE_TOO_SMALL">Size too small</option>
      <option value="SIZE_TOO_LARGE">Size too large</option>
      <option value="STYLE">Style</option>
      <option value="COLOR">Color</option>
      <option value="OTHER">Other</option>
    </select>
    <label><input type="checkbox" id="restock" checked> Restock</label>
  </div>
  <div class="row">
    <button class="ghost" id="resetBtn">Clear</button>
    <label id="notifyLbl"><input type="checkbox" id="notify"> Email customer</label>
    <button class="primary" id="fulfillBtn" disabled>Fulfill</button>
  </div>
</footer>

<script>
(function () {
  // ---------- server ----------
  // The Orders Apps Script web app (same idea as API_URL in the POS and Shipments tabs).
  // The app key is NOT kept here: each phone enters it once in Settings.
  const API_URL = window.PF_API_URL;

  // ---------- storage (the app key stays on this phone, not in the code) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  const $ = (id) => document.getElementById(id);
  const T = (s) => (window.pfT ? window.pfT(s) : s); // Arabic for confirm/prompt boxes
  const state = { mode: 'fulfill', orders: [], filter: 'all', order: null, items: [], scanner: null, camOn: false, lastCode: '', lastAt: 0, busy: false };
  const isRet = () => state.mode === 'return';
  const isRcv = () => state.mode === 'receive';   // receiving stock from suppliers (purchase orders)
  function idleMsg() {
    if (isRcv()) return 'Receive: pick a purchase order, or scan or type its number.';
    return isRet()
      ? 'Returns: scan the order barcode on the packing slip, or type the number.'
      : 'Pick an order, scan its barcode, or type the number.';
  }
  // Short fingerprint of what is being sent: a retry with the same counts reuses the same Shopify
  // idempotency key (never received twice); changed counts get a new key (Shopify refuses a reused key).
  function hashOf(x) {
    const str = JSON.stringify(x); let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36);
  }
  function newRequestId() {
    try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
  }

  // ---------- feedback ----------
  let actx;
  function beep(freq, ms) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.value = 0.15; o.start(); o.stop(actx.currentTime + ms / 1000);
    } catch (e) {}
  }
  function feedback(kind) {
    if (kind === 'ok') { beep(880, 90); if (navigator.vibrate) navigator.vibrate(40); }
    else if (kind === 'warn') { beep(520, 160); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
    else { beep(200, 350); if (navigator.vibrate) navigator.vibrate([200, 80, 200]); }
  }
  function say(msg, kind) {
    const b = $('banner');
    b.className = kind || '';
    b.textContent = msg;
    // while the camera is open, show the same message on the camera view, where staff are looking
    const c = $('camMsg');
    if (c) { c.className = kind || ''; c.textContent = (kind === 'ok' ? '✓ ' : kind === 'bad' ? '✗ ' : '') + msg; c.hidden = !state.camOn; }
  }
  // Any unexpected error is shown instead of failing silently
  window.addEventListener('error', function (e) { try { say('Error: ' + (e.message || e), 'bad'); } catch (x) {} });
  window.addEventListener('unhandledrejection', function (e) { try { say('Error: ' + ((e.reason && e.reason.message) || e.reason), 'bad'); } catch (x) {} });

  // ---------- API ----------
  async function api(payload) {
    const url = apiUrl(), key = store.get('appKey');
    if (!url || !key) { openSettings(); throw new Error(API_URL ? 'Enter the app key in Settings' : 'Set the API URL and key in Settings'); }
    // No Content-Type header: keeps it a "simple" request so Apps Script needs no CORS preflight
    const res = await fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ key: key }, payload)) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  // ---------- order ----------
  function orderNumberFrom(text) {
    const m = String(text).match(/\d{3,}/);
    return m ? m[0] : String(text).trim();
  }

  async function loadOrder(raw) {
    if (state.busy) return;
    const q = isRcv() ? String(raw).trim() : orderNumberFrom(raw); // PO names look like PO-1003
    if (!q) return;
    state.busy = true;
    say((isRcv() ? 'Loading purchase order ' : 'Loading order ') + q + '...');
    try {
      const data = await api({ action: isRcv() ? 'getPO' : isRet() ? 'getReturnable' : 'getOrder', query: q });
      if (isRet() && !data.items.length) {
        say('Order ' + data.order.name + ' has nothing to return (not shipped yet, or already returned).', 'bad');
        feedback('bad');
        return;
      }
      state.order = data.order;
      state.items = data.items.map((i) => Object.assign({ got: 0, rej: 0, can: 0, verified: false }, i)); // verified = its code was scanned; rej / can = rejected / cancelled (Receive)
      state.requestId = newRequestId(); // same id if Receive is tapped twice, so stock is never added twice
      $('orderInput').value = '';
      render();
      if (isRcv()) say(data.order.name + (data.order.supplier ? ' from ' + data.order.supplier : '') + ': scan each item that arrived.', 'ok');
      else say(isRet()
        ? 'Order ' + data.order.name + ': scan each item being returned.'
        : 'Order ' + data.order.name + ' loaded. Scan the items.', 'ok');
      feedback('ok');
    } catch (e) {
      say(e.message, 'bad'); feedback('bad');
    } finally { state.busy = false; }
  }

  // ---------- open orders list ----------
  async function loadList() {
    const mode = state.mode;
    state.orders = []; renderOrders();
    $('ordersCount').textContent = 'loading...';
    let rows = [];
    try {
      rows = (await api({ action: mode === 'receive' ? 'listPOs' : 'listOrders' })).orders || [];
    } catch (e) {
      if (mode === state.mode) say(e.message, 'bad');
    }
    if (mode !== state.mode) return; // switched mode while loading
    state.orders = rows;
    renderOrders();
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    const loc = window.pfLang && window.pfLang.get() === 'ar' ? 'ar-EG-u-nu-latn' : [];
    return d.toLocaleString(loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function renderOrders() {
    const box = $('orderList');
    const term = $('orderInput').value.replace(/[^0-9a-z]/gi, '').toLowerCase();
    const rows = state.orders.filter(function (o) {
      if (!isRcv() && state.filter !== 'all' && o.status !== state.filter) return false;
      return !term || o.name.replace(/[^0-9a-z]/gi, '').toLowerCase().indexOf(term) !== -1;
    });
    $('listTitle').textContent = isRcv() ? 'Purchase orders' : 'Open orders';
    $('ordersCount').textContent = rows.length + (isRcv() ? (rows.length === 1 ? ' purchase order' : ' purchase orders') : (rows.length === 1 ? ' order' : ' orders'));
    box.innerHTML = '';
    if (!rows.length) { box.innerHTML = '<div class="empty">' + (isRcv() ? 'No purchase orders waiting for stock.' : 'No orders to show.') + '</div>'; return; }
    rows.forEach(function (o) {
      const b = document.createElement('button');
      b.className = 'ord';
      const pillCls = o.status === 'UNFULFILLED' ? 'u' : o.status === 'PARTIALLY_FULFILLED' ? 'p' : 'o';
      const pillTxt = isRcv() ? 'Ordered' : o.status === 'UNFULFILLED' ? 'Unfulfilled' : o.status === 'PARTIALLY_FULFILLED' ? 'Partial' : o.status.replace(/_/g, ' ').toLowerCase();
      b.innerHTML = '<div><div class="a" data-no-i18n></div><div class="b" data-no-i18n></div><div style="margin-top:6px"><span class="pill ' + pillCls + '">' + pillTxt + '</span></div></div>' +
        '<div class="q"><b></b>items</div>';
      b.querySelector('.a').textContent = o.name;
      b.querySelector('.b').textContent = [o.customer, o.city, o.createdAt && fmtDate(o.createdAt)].filter(Boolean).join(' · ');
      b.querySelector('.q b').textContent = o.qty;
      b.addEventListener('click', function () { loadOrder(o.name); });
      box.appendChild(b);
    });
  }

  $('chips').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-f]');
    if (!b) return;
    state.filter = b.dataset.f;
    document.querySelectorAll('#chips button[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderOrders();
  });
  $('refreshBtn').addEventListener('click', loadList);
  document.addEventListener('pf-lang', renderOrders); // dates follow the language
  $('orderInput').addEventListener('input', renderOrders);

  // ---------- scanning ----------
  // Code matching (barcode or SKU): exact match first (ignoring spaces, dashes, case and leading zeros);
  // a real barcode (valid check digit) also matches the same product written as EAN-13, UPC-A, UPC-E,
  // or a supplier carton code (ITF-14 / GS1 (01)). Different codes never match.
  // Same product? Exact match first; "same barcode written differently" only for real GTINs (valid check digit).
  function codeNorm(s) {
    const v = String(s || '').trim(), d = v.replace(/[\s\-.]/g, '');
    return /^\d+$/.test(d) ? 'n:' + d.replace(/^0+(?=\d)/, '') : 'x:' + v.toLowerCase();
  }
  function gtinValid(d) {
    let sum = 0;
    for (let i = 0; i < d.length - 1; i++) { const n = +d[d.length - 2 - i]; sum += i % 2 === 0 ? n * 3 : n; }
    return (10 - sum % 10) % 10 === +d[d.length - 1];
  }
  function upcEtoA(e) {
    const ns = e[0], m = e.slice(1, 7), c = e[7], l = m[5];
    let a;
    if ('012'.includes(l)) a = m.slice(0, 2) + l + '0000' + m.slice(2, 5);
    else if (l === '3') a = m.slice(0, 3) + '00000' + m.slice(3, 5);
    else if (l === '4') a = m.slice(0, 4) + '00000' + m[4];
    else a = m.slice(0, 5) + '0000' + l;
    return ns + a + c;
  }
  function gtinKey(s) {
    let v = String(s || '').trim().replace(/^\]([A-Za-z]\d)/, '').replace(/\u001d/g, '');
    const ai = /\(01\)\s*(\d{14})/.exec(v) || (/^01\d{14}/.test(v) && v.length >= 16 ? /^01(\d{14})/.exec(v) : null);
    if (ai) v = ai[1];
    let d = v.replace(/[\s\-.]/g, '');
    if (!/^\d+$/.test(d)) return '';
    if (d.length === 8) {
      if (/^[01]/.test(d) && gtinValid(upcEtoA(d))) d = upcEtoA(d);      // UPC-E -> UPC-A
      else return gtinValid(d) ? 'e8:' + d : '';                         // EAN-8
    }
    if ([12, 13, 14].indexOf(d.length) === -1 || !gtinValid(d)) return '';
    let body = d.slice(0, -1);                                            // without the check digit
    if (d.length === 14) body = body.slice(1);                            // carton code: without the packaging digit
    return 'g:' + body.padStart(12, '0');
  }
  function sameCode(a, b) {
    if (!a || !b) return false;
    if (codeNorm(a) === codeNorm(b)) return true;
    const ka = gtinKey(a), kb = gtinKey(b);
    return !!ka && ka === kb;
  }

  function onScan(code, typed) {
    const now = Date.now();
    // The camera reads a barcode ~10 times a second while it is in view: count it once, and again only after
    // it has been out of view for a moment. A typed or scanner-gun entry always counts.
    if (!typed && code === state.lastCode && now - state.lastAt < 1200) { state.lastAt = now; return; }
    state.lastCode = code; state.lastAt = now;

    if (!state.order) { loadOrder(code); return; }

    // Only the product's barcode counts (all modes). A correct scan also unlocks that item's + / − buttons.
    // The code on the label can be the product's barcode or its SKU (many labels carry the SKU)
    const matches = state.items.filter((i) => (i.barcode && sameCode(code, i.barcode)) || (i.sku && sameCode(code, i.sku)));
    if (!matches.length) {
      // show what was read AND what Shopify has for this order, so a mismatch is easy to see
      const expected = state.items.filter((i) => (i.barcode || i.sku) && !i.verified).map((i) => i.sku ? (i.barcode ? i.barcode + ' / ' + i.sku : i.sku) : i.barcode)
        .filter((b, k, a) => a.indexOf(b) === k);
      say((isRcv() ? 'Not on this purchase order: ' : isRet() ? 'Not returnable on this order: ' : 'Not in this order: ') + code +
        (expected.length ? '\nShopify barcode / SKU: ' + expected.slice(0, 4).join(', ') + (expected.length > 4 ? ' (+' + (expected.length - 4) + ')' : '') : ''), 'bad');
      feedback('bad'); return;
    }
    // The same product can be on more than one line (e.g. shipped in two parcels): fill the first line with room left
    matches.forEach((i) => { i.verified = true; });
    const item = matches.find((i) => i.got + (i.rej || 0) + (i.can || 0) < i.need) || (isRcv() ? matches[matches.length - 1] : null);
    if (!item) {
      render();
      const need = matches.reduce((s, i) => s + i.need, 0);
      say(isRcv() ? 'Too many: only ' + need + ' ' + matches[0].title + ' expected'
        : isRet()
        ? 'Too many: only ' + need + ' ' + matches[0].title + ' can be returned'
        : 'Too many: ' + matches[0].title + ' (need ' + need + ')', 'bad');
      feedback('bad'); return;
    }
    item.got++;
    render();
    const row = $('list').children[state.items.indexOf(item)];
    if (row) { row.classList.add('flash'); try { row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
    const left = totalNeed() - totalGot();
    if (isRcv()) {
      const x = extraOf(item);
      if (x > 0) { say(item.title + ': received ' + item.got + ' of ' + item.need + ' (' + x + ' extra)', 'warn'); feedback('warn'); }
      else { say(item.title + ': received ' + item.got + ' of ' + item.need + (sumOf(openOf) === 0 ? '. Everything on this purchase order scanned.' : ''), 'ok'); feedback('ok'); }
    } else if (isRet()) {
      say(item.title + ': returning ' + item.got + ' of ' + item.need + (left === 0 ? '. Every returnable item scanned.' : ''), 'ok');
      feedback('ok');
    } else if (left === 0) { say('All items scanned. Ready to fulfill.', 'ok'); feedback('ok'); }
    else { say(item.title + ': ' + item.got + ' of ' + item.need, item.got === item.need ? 'ok' : 'warn'); feedback(item.got === item.need ? 'ok' : 'warn'); }
  }

  async function toggleCamera() {
    if (state.camOn) { await stopCamera(); return; }
    $('camwrap').classList.add('on');
    try {
      const F = Html5QrcodeSupportedFormats;
      state.scanner = new Html5Qrcode('reader', {
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE, F.DATA_MATRIX],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });
      await state.scanner.start(
        { facingMode: 'environment' },
        // scanning box follows the size of the camera view (a fixed 280px box missed barcodes on big screens)
        { fps: 10, qrbox: function (w, h) { return { width: Math.max(160, Math.floor(w * 0.9)), height: Math.max(80, Math.floor(h * 0.45)) }; } },
        function (text) { onScan(text); },   // the library also passes a result object: never treat it as "typed"
        function () {}
      );
      state.camOn = true; $('camBtn').textContent = 'Stop';
      say(state.order ? 'Point the camera at an item barcode' : idleMsg());
    } catch (e) {
      $('camwrap').classList.remove('on');
      say('Camera blocked. Allow camera access and use an https page.', 'bad');
    }
  }
  async function stopCamera() {
    try { if (state.scanner) { await state.scanner.stop(); state.scanner.clear(); } } catch (e) {}
    state.camOn = false; $('camBtn').textContent = 'Camera'; $('camwrap').classList.remove('on'); $('camMsg').hidden = true;
  }

  // ---------- render ----------
  const totalNeed = () => state.items.reduce((s, i) => s + i.need, 0);
  const totalGot = () => state.items.reduce((s, i) => s + i.got, 0);
  // Receive: rejected / cancelled take their share of the expected quantity first; scanned units beyond that are extra
  const onLine = (i) => Math.min(i.got, Math.max(0, i.need - (i.rej || 0) - (i.can || 0)));
  const extraOf = (i) => i.got - onLine(i);
  const openOf = (i) => Math.max(0, i.need - onLine(i) - (i.rej || 0) - (i.can || 0));
  const sumOf = (f) => state.items.reduce((s, i) => s + f(i), 0);

  function render() {
    const list = $('list');
    $('orderTitle').hidden = !state.order;
    $('labelsBtn').hidden = !(state.order && isRcv());
    $('orderInput').placeholder = state.order ? 'Item barcode or SKU' : isRcv() ? 'PO number' : 'Order number';
    $('loadBtn').textContent = state.order ? 'Add' : 'Load';
    $('orderInput').inputMode = state.order ? 'text' : 'numeric'; // SKUs can contain letters
    $('openOrders').hidden = !!state.order || isRet();
    $('fulfillBtn').textContent = isRcv()
      ? (totalGot() ? 'Receive ' + totalGot() + (totalGot() === 1 ? ' item' : ' items') : 'Receive')
      : isRet()
      ? (totalGot() ? 'Return ' + totalGot() + (totalGot() === 1 ? ' item' : ' items') : 'Return')
      : 'Fulfill';
    if (!state.order) {
      list.innerHTML = isRet() ? '<div class="empty">Scan or type an order number to start a return.</div>' : '';
      $('fulfillBtn').disabled = true; return;
    }
    $('orderName').textContent = state.order.name;
    $('orderSummary').textContent = isRcv()
      ? [totalGot() + ' received', sumOf((i) => i.rej) && sumOf((i) => i.rej) + ' rejected', sumOf((i) => i.can) && sumOf((i) => i.can) + ' cancelled', totalNeed() + ' expected'].filter(Boolean).join(' · ')
      : isRet()
      ? totalGot() + ' to return · ' + totalNeed() + ' returnable'
      : totalGot() + ' of ' + totalNeed() + ' items';
    list.innerHTML = '';
    state.items.forEach(function (it, idx) {
      const cls = isRcv() && extraOf(it) > 0 ? 'over' : (isRcv() ? openOf(it) === 0 : it.got >= it.need) ? 'done' : (it.got > 0 || it.rej || it.can) ? 'part' : '';
      const el = document.createElement('div');
      el.className = 'item ' + cls;
      const img = it.image ? '<img src="' + it.image.replace(/"/g, '') + '" alt="">' : '<div class="noimg"></div>';
      el.innerHTML = img +
        '<div><div class="t" data-no-i18n></div><div class="m"></div><div class="bin"></div></div>' +
        '<div class="count"><div class="n">' + it.got + '/' + it.need + '</div>' +
        (isRcv() && extraOf(it) > 0 ? '<div class="xtra">+' + extraOf(it) + ' extra</div>' : '') +
        '<div class="adj"><button data-i="' + idx + '" data-d="-1" aria-label="Remove one"' + (it.verified ? '' : ' class="locked"') + '>&minus;</button>' +
        '<button data-i="' + idx + '" data-d="1" aria-label="Add one"' + (it.verified ? '' : ' class="locked"') + '>+</button></div></div>'; // locked until the barcode is scanned
      el.querySelector('.t').textContent = it.title;
      const codes = document.createElement('span');
      codes.dir = 'ltr'; // keep SKU / barcode as written, also in Arabic
      codes.textContent = [it.sku && 'SKU ' + it.sku, it.barcode ? it.barcode : 'no barcode'].filter(Boolean).join('  ');
      el.querySelector('.m').appendChild(codes);
      if (isRcv()) {   // Rejected (needs the item scanned: it is physically here) and Cancelled (not coming)
        const rc = document.createElement('div');
        rc.className = 'rc';
        [['rej', 'Rejected', !it.verified], ['can', 'Cancelled', false]].forEach(function (f) {
          const w = document.createElement('div'), lab = document.createElement('span'), v = document.createElement('b');
          lab.textContent = f[1];
          v.textContent = it[f[0]]; if (it[f[0]]) v.className = 'on';
          w.appendChild(lab);
          [-1, 1].forEach(function (d) {
            const bt = document.createElement('button');
            bt.dataset.i = idx; bt.dataset.k = f[0]; bt.dataset.d = d; bt.textContent = d < 0 ? '−' : '+';
            bt.setAttribute('aria-label', (d < 0 ? 'Less ' : 'More ') + f[1].toLowerCase());
            if (f[2]) bt.className = 'locked';
            if (d < 0) { w.appendChild(bt); w.appendChild(v); } else w.appendChild(bt);
          });
          rc.appendChild(w);
        });
        el.querySelector('.m').after(rc);
      }
      if (!it.barcode && !it.sku) {
        const w = document.createElement('div');
        w.className = 'nobc'; w.textContent = 'No barcode or SKU: add one in Shopify to scan this item';
        el.querySelector('.m').after(w);
      } else if (!it.verified) {
        const w = document.createElement('div');
        w.className = 'lockhint'; w.textContent = 'Scan the barcode to unlock + / −';
        el.querySelector('.m').after(w);
      }
      // Receive: bin locations (variant + product) and the product's expiry date, editable
      const bins = [];
      if (it.binVariant) bins.push(['Variant bin:', it.binVariant]);
      if (it.binProduct && it.binProduct !== it.binVariant) bins.push(['Product bin:', it.binProduct]);
      if (it.expProduct) bins.push(['Expiry:', it.expProduct, isExpired(it.expProduct)]);
      const binBox = el.querySelector('.bin');
      bins.forEach(function (b) {
        const w = document.createElement('div'), lab = document.createElement('span'), val = document.createElement('b');
        lab.textContent = b[0] + ' '; val.textContent = b[1]; val.setAttribute('data-no-i18n', '');
        val.dir = 'ltr'; // keep "A-12" and "2026-01-31" as written, also in Arabic
        w.appendChild(lab); w.appendChild(val);
        if (b[2]) { val.className = 'expired'; const x = document.createElement('span'); x.textContent = ' (expired)'; w.appendChild(x); }
        binBox.appendChild(w);
      });
      if (isRcv() && it.variantId) {
        const e = document.createElement('button');
        e.className = 'edit'; e.dataset.edit = idx; e.textContent = 'Edit expiry';
        binBox.appendChild(e);
      }
      if (!binBox.childNodes.length) binBox.remove();
      list.appendChild(el);
    });
    $('fulfillBtn').disabled = isRcv() ? totalGot() + sumOf((i) => i.rej + i.can) === 0 : isRet() ? totalGot() === 0 : (totalNeed() === 0 || totalGot() !== totalNeed());
  }

  // ---------- bin locations / expiry date (Receive) ----------
  function isExpired(v) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
    if (!m) return false;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return new Date(+m[1], +m[2] - 1, +m[3]) < today;
  }
  async function editMeta(idx) {
    const it = state.items[idx];
    if (!it || state.busy) return;
    const exp = it.expProduct || '';
    const v = await pfSettings({ title: it.title, fields: [
      // only the expiry date can be changed; bin locations are shown but not editable
      // date picker when the stored value is a plain date (or empty); otherwise keep it as text
      { key: 'expProduct', label: 'Expiry date', type: (!exp || /^\d{4}-\d{2}-\d{2}$/.test(exp)) ? 'date' : 'text', value: exp }
    ] });
    if (!v) return;
    state.busy = true;
    say('Saving ' + it.title + '...');
    try {
      const data = await api({ action: 'setItemMeta', variantId: it.variantId, values: v });
      // the same variant / product can be on several lines: update them all
      state.items.forEach(function (x) {
        if (x.productId && x.productId === it.productId) x.expProduct = data.values.expProduct;
      });
      render();
      say(data.changed ? 'Saved expiry date for ' + it.title : 'No changes', 'ok');
      feedback('ok');
    } catch (e) {
      say(e.message, 'bad'); feedback('bad');
    } finally { state.busy = false; }
  }

  $('list').addEventListener('click', function (e) {
    const ed = e.target.closest('button[data-edit]');
    if (ed) { editMeta(+ed.dataset.edit); return; }
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    const it = state.items[+b.dataset.i], d = +b.dataset.d, k = b.dataset.k;
    if (k) {          // Receive: rejected / cancelled
      if (k === 'rej' && !it.verified) { say('Scan the barcode of ' + it.title + ' first', 'bad'); feedback('bad'); return; }
      if (d > 0 && it.rej + it.can >= it.need) { say('Rejected + cancelled cannot be more than expected (' + it.need + ')', 'bad'); feedback('bad'); return; }
      it[k] = Math.max(0, it[k] + d);
      render(); return;
    }
    if (!it.verified) { say('Scan the barcode of ' + it.title + ' first', 'bad'); feedback('bad'); return; }
    it.got = isRcv() ? Math.max(0, it.got + d) : Math.max(0, Math.min(it.need, it.got + d)); // Receive may go above the PO
    render();
  });

  // ---------- barcode labels (Receive): one per unit received, else per unit expected ----------
  $('labelsBtn').addEventListener('click', function () {
    if (!state.order) return;
    pfLabels.open(state.items.map(function (it) {
      return { title: it.title, code: it.sku || it.barcode || '',
        sub: [it.binVariant || it.binProduct, it.expProduct && 'EXP ' + it.expProduct].filter(Boolean).join(' · '),
        copies: it.got > 0 ? it.got : Math.max(0, it.need - it.rej - it.can) };
    }));
  });

  // ---------- fulfill ----------
  $('fulfillBtn').addEventListener('click', function () { if (isRcv()) submitReceive(); else if (isRet()) submitReturn(); else submitFulfill(); });

  async function submitReceive() {
    if (state.busy) return;
    const n = totalGot(), name = state.order.name, missing = sumOf(openOf);
    const xtra = sumOf(extraOf), rej = sumOf((i) => i.rej), can = sumOf((i) => i.can);
    if (!confirm(T('Receive ' + n + (n === 1 ? ' item' : ' items') + ' from ' + name + ' into stock?') +
      (xtra ? '\n' + T(xtra + ' of them are extra (more than ordered).') : '') +
      (rej ? '\n' + T(rej + ' rejected.') : '') + (can ? '\n' + T(can + ' cancelled.') : '') +
      (missing > 0 ? '\n' + T(missing + ' not scanned will stay open on the purchase order.') : ''))) return;
    state.busy = true; $('fulfillBtn').disabled = true;
    say('Receiving ' + name + '...');
    const rcvItems = state.items.filter((i) => (i.verified && i.got > 0) || i.rej > 0 || i.can > 0).map((i) => ({
      shipmentId: i.shipmentId || '', sliId: i.sliId || '', transferId: i.transferId || '', inventoryItemId: i.inventoryItemId || '',
      need: i.need, qty: i.verified ? i.got : 0, rejected: i.rej, canceled: i.can, draft: !!i.draft
    }));
    try {
      const data = await api({
        action: 'receivePO',
        requestId: state.requestId + '-' + hashOf(rcvItems),
        locationId: state.order.locationId || '', poName: name,
        items: rcvItems
      });
      feedback('ok');
      state.order = null; state.items = []; render();
      say('Received ' + data.received + (data.received === 1 ? ' item' : ' items') + ' from ' + name + ' into stock.' +
        (data.extra ? '\n' + data.extra + ' extra' : '') + (data.rejected ? '\n' + data.rejected + ' rejected.' : '') + (data.canceled ? '\n' + data.canceled + ' cancelled.' : ''), 'ok');
      loadList();
    } catch (e) {
      say(e.message, 'bad'); feedback('bad'); $('fulfillBtn').disabled = false;
    } finally { state.busy = false; }
  }

  async function submitReturn() {
    if (state.busy) return;
    const n = totalGot(), name = state.order.name;
    const restock = $('restock').checked;
    if (!confirm(T('Create a return for ' + n + (n === 1 ? ' item' : ' items') + ' on ' + name + '?' +
      (restock ? '\nThe items will be put back into stock.' : '\nThe items will NOT be restocked.')))) return;
    state.busy = true; $('fulfillBtn').disabled = true;
    say('Creating return for ' + name + '...');
    try {
      const data = await api({
        action: 'processReturn',
        orderId: state.order.id,
        notify: $('notify').checked,
        restock: restock,
        reason: $('reason').value,
        items: state.items.filter((i) => i.verified && i.got > 0).map((i) => ({ fliId: i.fliId, qty: i.got, locationId: i.locationId || '' }))
      });
      feedback('ok');
      state.order = null; state.items = []; render();
      say('Return ' + (data.returnName || '') + ' created for ' + name + (restock ? ', items restocked' : '') +
        '. Issue the refund in Shopify admin.', 'ok');
    } catch (e) {
      say(e.message, 'bad'); feedback('bad'); $('fulfillBtn').disabled = false;
    } finally { state.busy = false; }
  }

  async function submitFulfill() {
    if (state.busy) return;
    if (state.items.some((i) => !i.verified)) { say('Scan the barcode of every item first', 'bad'); feedback('bad'); return; }
    state.busy = true; $('fulfillBtn').disabled = true;
    say('Fulfilling ' + state.order.name + '...');
    try {
      await api({
        action: 'fulfill',
        orderName: state.order.name,
        notify: $('notify').checked,
        items: state.items.map((i) => ({ foId: i.foId, foliId: i.foliId, qty: i.got }))
      });
      feedback('ok');
      const name = state.order.name;
      state.order = null; state.items = []; render();
      say('Order ' + name + ' fulfilled. Scan the next order.', 'ok');
      loadList();
    } catch (e) {
      say(e.message, 'bad'); feedback('bad'); $('fulfillBtn').disabled = false;
    } finally { state.busy = false; }
  }

  $('resetBtn').addEventListener('click', function () {
    state.order = null; state.items = []; render();
    say(idleMsg());
    renderOrders();
  });

  // anything counted on the open order (received units, or Receive's rejected / cancelled counts)
  function hasScans() { return totalGot() > 0 || state.items.some(function (i) { return i.rej > 0 || i.can > 0; }); }

  // ---------- mode ----------
  function setMode(m, initial) {
    if (!initial) {
      if (m === state.mode || state.busy) return;
      if (state.order && hasScans() && !confirm(T('Discard the scans for ' + state.order.name + '?'))) return;
    }
    state.mode = m;
    store.set('mode', m);
    document.body.classList.toggle('ret', m === 'return');
    document.body.classList.toggle('rcv', m === 'receive');
    $('modeLabel').textContent = m === 'return' ? 'Returns' : m === 'receive' ? 'Receive' : 'Fulfill';
    document.querySelectorAll('#modes button').forEach(function (x) { x.classList.toggle('on', x.dataset.m === m); });
    state.order = null; state.items = [];
    render();
    if (!initial) {
      say(idleMsg());
      if (m !== 'return' && ready()) loadList();
    }
  }
  $('modes').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-m]');
    if (b) setMode(b.dataset.m);
  });
  // The box loads an order when none is open; once one is open it counts items by barcode or SKU,
  // so a USB / Bluetooth barcode scanner (which types the code and presses Enter) works too.
  function submitBox() {
    const v = $('orderInput').value.trim();
    if (!v) return;
    if (state.order) { $('orderInput').value = ''; onScan(v, true); }
    else loadOrder(v);
  }
  $('loadBtn').addEventListener('click', submitBox);
  $('orderInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitBox(); });
  $('camBtn').addEventListener('click', toggleCamera);

  // ---------- settings ----------
  function apiUrl() { return API_URL || store.get('apiUrl'); }
  function ready() { return !!(apiUrl() && store.get('appKey')); }
  async function openSettings() {
    const fields = [];
    if (!API_URL) fields.push({ key: 'apiUrl', label: 'Apps Script web app URL', value: store.get('apiUrl') }); // only if not set in the code above
    fields.push({ key: 'appKey', label: 'App key', secret: true, value: store.get('appKey') });
    const v = await pfSettings({ title: 'Settings', fields: fields });
    if (!v) return;
    Object.keys(v).forEach(function (k) { store.set(k, v[k]); });
    if (!ready()) say(API_URL ? 'Open Settings and enter the app key.' : 'Open Settings and enter the API URL and app key.', 'warn');
    else { say(idleMsg()); if (!state.order && !isRet()) loadList(); }
  }
  $('settingsBtn').addEventListener('click', openSettings);

  // Inside the PetFriend app: stop the camera when the user switches to another tab
  window.addEventListener('message', function (e) { if (e.origin === location.origin && e.data === 'pf-hide' && state.camOn) stopCamera(); });
  // From the Pick list (through the main page): open an order in Fulfill
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'pf-open-order' || state.busy) return;
    if (state.order && hasScans() && !confirm(T('Discard the scans for ' + state.order.name + '?'))) return;
    state.order = null; state.items = [];
    if (state.mode !== 'fulfill') setMode('fulfill', true); else render();
    loadOrder(String(e.data.order || ''));
  });

  setMode(['return', 'receive'].indexOf(store.get('mode')) !== -1 ? store.get('mode') : 'fulfill', true);
  if (!ready()) say(API_URL ? 'Open Settings and enter the app key.' : 'Open Settings and enter the API URL and app key.', 'warn');
  else if (isRet()) say(idleMsg());
  else loadList();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3031b">
<link rel="icon" href="../icon-192.png">
<title>Pet Friend Pick List</title>
<script src="../i18n.js"></script>
<script src="../settings.js"></script>
<style>
  /* Pet Friend brand: same palette as the other tabs */
  :root {
    --ink: #2a1417; --paper: #e9fcfd; --card: #ffffff; --line: #b9ecf1; --muted: #6b5f62;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #c00018; --bad-bg: #ffe4e7; --accent: #e3031b; --on: #ffffff; --soft: #f1fdfe; --done-bg: #f3fbf5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eaf7f8; --paper: #0f1c1e; --card: #17282b; --line: #27403f; --muted: #8fb0b3;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #ff6b7a; --bad-bg: #3a1218; --accent: #ff4a5c; --on: #1a0508; --soft: #1d3236; --done-bg: #132b20; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; padding: 14px 12px 4px; }
  header .logo { width: 44px; height: 44px; border-radius: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; }
  header h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  header button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 12px 40px; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .bar button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; font-size: 15px; }
  .bar button.primary { background: var(--accent); border-color: var(--accent); color: var(--on); }
  .bar button:disabled { opacity: .45; }
  .bar label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-inline-start: auto; }

  #banner { white-space: pre-line; min-height: 44px; display: flex; align-items: center; padding: 10px 14px; border-radius: 10px; font-weight: 600;
    margin-bottom: 10px; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
  #banner.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  #banner.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

  .sum { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 4px 2px 8px; color: var(--muted); font-size: 14px; }
  .sum strong { color: var(--ink); font-size: 16px; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 0 2px 12px; }
  .progress div { height: 100%; width: 0; background: var(--ok); transition: width .2s; }

  .row { display: grid; grid-template-columns: 30px 64px 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 2px solid var(--line);
    border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .row.picked { background: var(--done-bg); border-color: var(--ok); opacity: .7; }
  .row .tick { width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 7px; display: grid; place-items: center; font-weight: 800; color: var(--on); }
  .row.picked .tick { background: var(--ok); border-color: var(--ok); }
  .row img, .row .noimg { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--soft); }
  .row .t { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .row .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row .bins { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 13px; }
  .row .bins span { color: var(--muted); }
  .row .bins b { color: #0f766e; font-size: 15px; }
  .row .ords { color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-word; }
  .row .qty { text-align: center; min-width: 52px; }
  .row .qty b { display: block; font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .row .qty small { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 8px; }
  #printHead { display: none; }

  @media (min-width: 900px) {
    header, main { max-width: 1100px; }
    #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .row { margin-bottom: 0; }
  }
  /* Print / save as PDF: a compact list sorted by bin, like the emailed PDF */
  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; color: #000; font-size: 11px; }
    header, .bar, #banner, .progress { display: none !important; }
    #printHead { display: block; text-align: center; margin-bottom: 6px; }
    #printHead h2 { margin: 0; font-size: 18px; }
    main { max-width: none; padding: 0; }
    #list { display: block; }
    .row { grid-template-columns: 18px 48px 1fr auto; border: 1px solid #999; border-radius: 0; margin: 0 0 -1px; padding: 4px 6px; opacity: 1 !important; background: #fff !important; break-inside: avoid; }
    .row .tick { width: 16px; height: 16px; border: 1px solid #000; border-radius: 2px; background: #fff !important; color: #000; }
    .row img, .row .noimg { width: 48px; height: 48px; }
    .row .qty b { font-size: 20px; }
    .row .bins b { color: #000; }
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="../icon-192.png" alt="Pet Friend">
  <h1>Pet Friend Pick List<small id="genAt"></small></h1>
  <button id="settingsBtn">Settings</button>
</header>
<main>
  <div class="bar">
    <button class="primary" id="refreshBtn">↻ Refresh</button>
    <button id="printBtn">Print</button>
    <button id="emailBtn">Email PDF</button>
    <label><input type="checkbox" id="hidePicked"> Hide picked</label>
  </div>
  <div id="banner">Orders that are paid, or tagged "confirmed", and not yet fulfilled.</div>
  <div id="printHead"><h2>PetFriend Pick List</h2><div id="printSub"></div></div>
  <div class="sum"><strong id="sumText"></strong><span id="pickedText"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <div id="list"></div>
</main>
<script>
(function () {
  // Same server as the Orders tab (one Apps Script for the whole app); the app key is the one entered in Orders.
  const API_URL = 'https://script.google.com/macros/s/AKfycbxCt3AtTpBYGvVmicXQqvrPXNKkVCU82GdjSPIo5SWBfdD5N9b7wbByvUmCwR_fF6rv/exec';
  const $ = (id) => document.getElementById(id);
  const T = (s) => (window.pfT ? window.pfT(s) : s);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const state = { products: [], orders: 0, generatedAt: '', busy: false };
  // picked lines are remembered on this phone; a line whose quantity changes (new orders) is un-ticked
  let picked = {};
  try { picked = JSON.parse(store.get('pf_picked') || '{}'); } catch (e) { picked = {}; }
  const pickKey = (p) => p.key + '|' + p.quantity;

  function say(msg, kind) { const b = $('banner'); b.className = kind || ''; b.textContent = msg; }

  async function api(payload) {
    const key = store.get('appKey');
    if (!key) { openSettings(); throw new Error('Enter the app key in Settings'); }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ key: key }, payload)) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function load() {
    if (state.busy) return;
    state.busy = true; $('refreshBtn').disabled = true;
    say('Loading pick list...');
    try {
      const d = await api({ action: 'pickList' });
      state.products = d.products; state.orders = d.orders; state.generatedAt = d.generatedAt;
      // forget ticks of lines that are no longer on the list
      const keep = {}; state.products.forEach((p) => { if (picked[pickKey(p)]) keep[pickKey(p)] = 1; });
      picked = keep; store.set('pf_picked', JSON.stringify(picked));
      say(d.orders ? 'Sorted by bin location. Tap a line when it is picked.' : 'No orders to pick right now.', 'ok');
      render();
    } catch (e) { say(e.message, 'bad'); }
    finally { state.busy = false; $('refreshBtn').disabled = false; }
  }

  function fmt(iso) {
    if (!iso) return '';
    const loc = window.pfLang && window.pfLang.get() === 'ar' ? 'ar-EG-u-nu-latn' : [];
    return new Date(iso).toLocaleString(loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function render() {
    const ps = state.products, units = ps.reduce((s, p) => s + p.quantity, 0);
    const done = ps.filter((p) => picked[pickKey(p)]).length;
    $('genAt').textContent = state.generatedAt ? fmt(state.generatedAt) : '';
    $('sumText').textContent = state.orders + (state.orders === 1 ? ' order' : ' orders') + ' · ' + ps.length + (ps.length === 1 ? ' product' : ' products') + ' · ' + units + ' units';
    $('pickedText').textContent = ps.length ? 'Picked ' + done + ' of ' + ps.length : '';
    $('bar').style.width = ps.length ? Math.round(done / ps.length * 100) + '%' : '0';
    $('printSub').textContent = $('sumText').textContent + ' · ' + fmt(state.generatedAt);
    const list = $('list');
    list.innerHTML = '';
    if (!ps.length) { list.innerHTML = '<div class="empty">' + (state.generatedAt ? 'No orders to pick right now.' : '') + '</div>'; return; }
    const hide = $('hidePicked').checked;
    ps.forEach(function (p, idx) {
      const isPicked = !!picked[pickKey(p)];
      if (hide && isPicked) return;
      const el = document.createElement('div');
      el.className = 'row' + (isPicked ? ' picked' : '');
      el.dataset.i = idx;
      el.innerHTML = '<div class="tick">' + (isPicked ? '✓' : '') + '</div>' +
        (p.image ? '<img loading="lazy" src="' + String(p.image).replace(/"/g, '') + '" alt="">' : '<div class="noimg"></div>') +
        '<div><div class="t" data-no-i18n></div><div class="m"></div><div class="bins"></div><div class="ords"></div></div>' +
        '<div class="qty"><b></b><small>pcs</small></div>';
      el.querySelector('.t').textContent = p.variantName ? p.title + ' - ' + p.variantName : p.title;
      const sku = document.createElement('span'); sku.dir = 'ltr'; sku.setAttribute('data-no-i18n', ''); sku.textContent = p.sku ? 'SKU ' + p.sku : '';
      el.querySelector('.m').appendChild(sku);
      [['Variant bin:', p.variantBin], ['Product bin:', p.productBin]].forEach(function (b) {
        if (!b[1]) return;
        const w = document.createElement('div'), l = document.createElement('span'), v = document.createElement('b');
        l.textContent = b[0] + ' '; v.textContent = b[1]; v.dir = 'ltr'; v.setAttribute('data-no-i18n', '');
        w.appendChild(l); w.appendChild(v); el.querySelector('.bins').appendChild(w);
      });
      const o = document.createElement('span'); o.dir = 'ltr'; o.setAttribute('data-no-i18n', ''); o.textContent = p.orders.join(', ');
      el.querySelector('.ords').appendChild(o);
      el.querySelector('.qty b').textContent = p.quantity;
      list.appendChild(el);
    });
  }

  $('list').addEventListener('click', function (e) {
    const row = e.target.closest('.row');
    if (!row) return;
    const p = state.products[+row.dataset.i], k = pickKey(p);
    if (picked[k]) delete picked[k]; else picked[k] = 1;
    store.set('pf_picked', JSON.stringify(picked));
    render();
  });
  $('hidePicked').addEventListener('change', render);
  $('refreshBtn').addEventListener('click', load);
  $('printBtn').addEventListener('click', function () { window.print(); });
  $('emailBtn').addEventListener('click', async function () {
    if (state.busy) return;
    if (!confirm(T('Email the pick list PDF now?'))) return;
    state.busy = true; $('emailBtn').disabled = true;
    say('Sending the pick list...');
    try {
      const d = await api({ action: 'emailPickList' });
      say(d.sent ? 'Pick list emailed: ' + d.orders + ' orders, ' + d.products + ' products.' : 'No orders to pick right now.', 'ok');
    } catch (e) { say(e.message, 'bad'); }
    finally { state.busy = false; $('emailBtn').disabled = false; }
  });
  document.addEventListener('pf-lang', render);

  async function openSettings() {
    const v = await pfSettings({ title: 'Settings', fields: [{ key: 'appKey', label: 'App key', secret: true, value: store.get('appKey') }] });
    if (!v) return;
    store.set('appKey', v.appKey);
    if (v.appKey) load();
  }
  $('settingsBtn').addEventListener('click', openSettings);

  render();
  if (store.get('appKey')) load(); else say('Open Settings and enter the app key.', 'bad');
})();
</script>
</body>
</html>

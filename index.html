<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9001b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PetFriend">
<title>PetFriend</title>
<script src="i18n.js"></script>
<style>
  :root { --bar: #ffffff; --line: #d5dbd4; --ink: #17201a; --muted: #6b7280; --acc: #d9001b; --bg: #f3f5f2; }
  @media (prefers-color-scheme: dark) {
    :root { --bar: #17282b; --line: #27403f; --ink: #eaf7f8; --muted: #8fb0b3; --acc: #ff4a5c; --bg: #0f1c1e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; height: 100dvh; background: var(--bg);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #frames { flex: 1; position: relative; min-height: 0; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #frames iframe[hidden] { display: none; }
  nav {
    display: flex; background: var(--bar); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav button {
    flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600;
    padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
  }
  nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on { color: var(--acc); }
  nav button:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; }
  nav .brand { display: none; }
  /* phones: the tab bar is a carousel. Tabs keep their normal size (24px icons, 12px names) and the bar scrolls
     sideways with a finger; the open tab is scrolled into view. */
  @media (max-width: 899px) {
    nav { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: 0 0 auto; min-width: 78px; padding: 8px 8px 10px; scroll-snap-align: center; white-space: nowrap; }
  }
  /* Computer / tablet: tab bar becomes a side bar */
  @media (min-width: 900px) {
    body { flex-direction: row; }
    nav { order: -1; flex-direction: column; justify-content: flex-start; width: 92px; border-top: 0; border-right: 1px solid var(--line);
      padding: 12px 0 env(safe-area-inset-bottom, 0px); gap: 4px; }
    nav .brand { display: block; width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 10px; }
    nav button { flex: 0 0 auto; padding: 12px 4px; font-size: 13px; }
    nav button svg { width: 26px; height: 26px; }
    nav button.on { background: color-mix(in srgb, var(--acc) 10%, transparent); box-shadow: inset 3px 0 0 var(--acc); }
    [dir="rtl"] nav button.on { box-shadow: inset -3px 0 0 var(--acc); }
    [dir="rtl"] nav { border-right: 0; border-left: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="frames"></div>
<nav id="tabs" aria-label="Tools">
  <img class="brand" src="icon-192.png" alt="Pet Friend">
  <button data-t="pos" aria-label="Point of sale">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 8h4"/></svg>POS
  </button>
  <button data-t="check" aria-label="Check a product">
    <svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v5"/></svg>Check
  </button>
  <button data-t="orders" aria-label="Fulfill and returns">
    <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg>Orders
  </button>
  <button data-t="receive" aria-label="Purchase orders">
    <svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/></svg>Purchase orders
  </button>
  <button data-t="today" aria-label="Today">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Today
  </button>
  <button data-t="picklist" aria-label="Pick list">
    <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10l1.5 1.5L13 9M9 16l1.5 1.5L13 15M15 11h1M15 17h1"/></svg>Pick list
  </button>
  <button data-t="shipments" aria-label="Shipment photos">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Shipments
  </button>
  <button data-t="returns" aria-label="Return shipments">
    <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5v-3M9 17l-3-3 3-3M6 14h7"/></svg>Return shipments
  </button>
</nav>
<script>
(function () {
  // Each tool is its own page with its own login (PIN / key); loaded on first use and kept alive after that,
  // so e.g. a POS cart survives while you check a shipment.
  const PAGES = { pos: 'pos/index.html', check: 'orders/index.html?only=check', orders: 'orders/index.html', receive: 'orders/index.html?only=receive', picklist: 'picklist/index.html', shipments: 'shipments/index.html', returns: 'shipments/index.html?only=returns', today: 'today/index.html' };
  const frames = {};
  let current = null;

  function show(t) {
    if (!PAGES[t] || t === current) return;
    if (current && frames[current]) {
      frames[current].hidden = true;
      try { frames[current].contentWindow.postMessage('pf-hide', location.origin); } catch (e) {} // turns its camera off
    }
    if (!frames[t]) {
      const f = document.createElement('iframe');
      f.src = PAGES[t];
      f.title = t;
      f.allow = 'camera; microphone; autoplay; fullscreen';
      f.addEventListener('load', function () { f.dataset.ready = '1'; });
      document.getElementById('frames').appendChild(f);
      frames[t] = f;
    } else {
      // tell a tab that is shown again, so it can refresh its data (e.g. Today, pick list order status)
      try { frames[t].contentWindow.postMessage('pf-show', location.origin); } catch (e) {}
    }
    frames[t].hidden = false;
    current = t;
    document.querySelectorAll('#tabs button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.t === t);
      b.setAttribute('aria-current', b.dataset.t === t ? 'page' : 'false');
    });
    // carousel (phones): bring the open tab into view
    const on = document.querySelector('#tabs button[data-t="' + t + '"]');
    if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: 'nearest', inline: 'center', behavior: current ? 'smooth' : 'auto' }); } catch (e) {} }
    try { localStorage.setItem('pf_tab', t); } catch (e) {}
    if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  }

  // The language is chosen in each tab's Settings window; all tabs follow (shared saved choice, see i18n.js)

  // Pick list -> "open this order": switch to Orders and pass the request on once that tab has loaded
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'pf-open-order') return;
    show('orders');
    const f = frames.orders, send = function () { try { f.contentWindow.postMessage(e.data, location.origin); } catch (x) {} };
    if (f.dataset.ready) send(); else f.addEventListener('load', function () { setTimeout(send, 50); }, { once: true });
  });

  document.getElementById('tabs').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-t]');
    if (b) show(b.dataset.t);
  });

  let start = location.hash.slice(1);
  if (!PAGES[start]) { try { start = localStorage.getItem('pf_tab') || ''; } catch (e) { start = ''; } }
  show(PAGES[start] ? start : 'pos');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>

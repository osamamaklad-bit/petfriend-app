<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3031b">
<link rel="icon" href="../icon-192.png">
<title>Pet Friend Pick List</title>
<script src="../config.js"></script><script src="../i18n.js"></script>
<script src="../settings.js"></script>
<style>
  /* "hidden" must always win over a class that sets display (e.g. .ordertitle, .bar, .modes) */
  [hidden] { display: none !important; }
  /* Pet Friend brand: same palette as the other tabs */
  :root {
    --ink: #2a1417; --paper: #e9fcfd; --card: #ffffff; --line: #b9ecf1; --muted: #6b5f62;
    --ok: #15803d; --ok-bg: #dcfce7; --bad: #c00018; --bad-bg: #ffe4e7; --accent: #e3031b; --on: #ffffff; --soft: #f1fdfe; --done-bg: #f3fbf5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eaf7f8; --paper: #0f1c1e; --card: #17282b; --line: #27403f; --muted: #8fb0b3;
      --ok: #4ade80; --ok-bg: #12301f; --bad: #ff6b7a; --bad-bg: #3a1218; --accent: #ff4a5c; --on: #1a0508; --soft: #1d3236; --done-bg: #132b20; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; padding: 14px 12px 4px; }
  header .logo { width: 44px; height: 44px; border-radius: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; }
  header h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  header button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 12px 40px; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .bar button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; font-size: 15px; }
  .bar button.primary { background: var(--accent); border-color: var(--accent); color: var(--on); }
  .bar button:disabled { opacity: .45; }
  .bar label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); margin-inline-start: auto; }

  #banner { white-space: pre-line; min-height: 44px; display: flex; align-items: center; padding: 10px 14px; border-radius: 10px; font-weight: 600;
    margin-bottom: 10px; background: var(--card); border: 2px solid var(--line); color: var(--muted); }
  #banner.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  #banner.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }

  .sum { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 4px 2px 8px; color: var(--muted); font-size: 14px; }
  .sum strong { color: var(--ink); font-size: 16px; }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 0 2px 12px; }
  .progress div { height: 100%; width: 0; background: var(--ok); transition: width .2s; }

  .row { display: grid; grid-template-columns: 30px 64px 1fr auto; gap: 10px; align-items: center; background: var(--card); border: 2px solid var(--line);
    border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .row.picked { background: var(--done-bg); border-color: var(--ok); opacity: .7; }
  .row .tick { width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 7px; display: grid; place-items: center; font-weight: 800; color: var(--on); }
  .row.picked .tick { background: var(--ok); border-color: var(--ok); }
  .row img, .row .noimg { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--soft); }
  .row .t { font-weight: 700; font-size: 15px; line-height: 1.25; }
  .row .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row .bins { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 13px; }
  .row .bins span { color: var(--muted); }
  .row .bins b { color: #0f766e; font-size: 15px; }
  .row .ords { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .row .ords button { font: inherit; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; }
  .row .ords button.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .fulfilledLine { color: var(--muted); font-size: 13px; margin: -4px 2px 10px; }
  @media print { .row .ords button { border: 0; padding: 0 4px 0 0; background: none !important; color: #000 !important; } .fulfilledLine { display: none; } }
  .row .qty { text-align: center; min-width: 52px; }
  .row .qty b { display: block; font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .row .qty small { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 8px; }
  .pl { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: start; font: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .pl.new { border-color: var(--accent); }
  .pl .a { font-weight: 800; font-size: 17px; }
  .pl .b { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .pl .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); margin-inline-start: 6px; }
  .pl .tag.m { background: #fef3c7; color: #9a4a00; }
  .pl .q { text-align: end; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pl .q b { display: block; font-size: 18px; color: var(--ink); }
  .pl.done { opacity: .6; }
  .pl.fin { opacity: .55; border-style: dashed; }
  .pl .tag.f { background: var(--ok-bg, #dcfce7); color: var(--ok, #15803d); }
  .bar button.finish { background: var(--ok, #15803d); border-color: var(--ok, #15803d); color: #fff; }
  .bar button.reopen { border-color: var(--ok, #15803d); color: var(--ok, #15803d); }
  #showDoneBtn { width: 100%; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; padding: 10px; cursor: pointer; }
  .backrow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .backrow button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 600; }
  .backrow strong { font-size: 18px; }
  [hidden] { display: none !important; }
  #printHead { display: none; }

  @media (min-width: 900px) {
    header, main { max-width: 1100px; }
    #list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .row { margin-bottom: 0; }
  }
  /* Print / save as PDF: a compact list sorted by bin, like the emailed PDF */
  @media print {
    @page { size: A4; margin: 10mm; }
    body { background: #fff; color: #000; font-size: 11px; }
    header, .bar, #banner, .progress, .backrow, #lists { display: none !important; }
    #printHead { display: block; text-align: center; margin-bottom: 6px; }
    #printHead h2 { margin: 0; font-size: 18px; }
    main { max-width: none; padding: 0; }
    #list { display: block; }
    .row { grid-template-columns: 18px 48px 1fr auto; border: 1px solid #999; border-radius: 0; margin: 0 0 -1px; padding: 4px 6px; opacity: 1 !important; background: #fff !important; break-inside: avoid; }
    .row .tick { width: 16px; height: 16px; border: 1px solid #000; border-radius: 2px; background: #fff !important; color: #000; }
    .row img, .row .noimg { width: 48px; height: 48px; }
    .row .qty b { font-size: 20px; }
    .row .bins b { color: #000; }
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="../icon-192.png" alt="Pet Friend">
  <h1>Pet Friend Pick List<small id="genAt"></small></h1>
  <button id="settingsBtn">Settings</button>
</header>
<main>
  <div class="bar">
    <button class="primary" id="createBtn">＋ Create pick list now</button>
    <button id="refreshBtn">↻ Refresh</button>
  </div>
  <div id="banner">Pick lists are made automatically from 10:00 to 14:00 when new orders qualify (paid, or tagged "confirmed").</div>

  <!-- the pick lists of the last days -->
  <div id="lists"></div>
  <button id="showDoneBtn" hidden></button>

  <!-- one pick list -->
  <div id="detail" hidden>
    <div class="backrow"><button id="backBtn">‹ Back</button><strong id="plName" data-no-i18n></strong></div>
    <div class="bar">
      <button id="finishBtn" class="finish">✓ Finished</button>
      <button id="printBtn">Print</button>
      <label><input type="checkbox" id="hidePicked"> Hide picked</label>
    </div>
    <div id="printHead"><h2>PetFriend Pick List</h2><div id="printSub"></div></div>
    <div class="sum"><strong id="sumText"></strong><span id="pickedText"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="fulfilledLine" id="fulfilledLine"></div>
    <div id="list"></div>
  </div>
</main>
<script>
(function () {
  // Same server as the Orders tab (one Apps Script for the whole app); the app key is the one entered in Orders.
  const API_URL = window.PF_API_URL;
  const $ = (id) => document.getElementById(id);
  const T = (s) => (window.pfT ? window.pfT(s) : s);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const state = { lists: [], current: null, busy: false, known: null, showDone: false };
  // picked lines are remembered on this phone, per pick list
  let picked = {};
  try { picked = JSON.parse(store.get('pf_picked2') || '{}'); } catch (e) { picked = {}; }
  const pickKey = (p) => state.current.id + '|' + p.key;
  const savePicked = () => store.set('pf_picked2', JSON.stringify(picked));
  const doneCount = (id, n) => Object.keys(picked).filter((k) => k.indexOf(id + '|') === 0).length;

  function say(msg, kind) { const b = $('banner'); b.className = kind || ''; b.textContent = msg; }

  async function api(payload) {
    const key = store.get('appKey');
    if (!key) { openSettings(); throw new Error('Enter the Orders pass in Settings'); }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ key: key }, payload)) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error === 'Wrong app key' ? 'Wrong Orders pass' : data.error || 'Request failed');
    return data;
  }

  function fmt(iso, withDay) {
    if (!iso) return '';
    const loc = window.pfLang && window.pfLang.get() === 'ar' ? 'ar-EG-u-nu-latn' : [];
    return new Date(iso).toLocaleString(loc, withDay === false ? { hour: '2-digit', minute: '2-digit' } : { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  // ---------- the pick lists ----------
  async function loadLists(quiet) {
    try {
      const d = await api({ action: 'listPickLists' });
      const fresh = state.known ? d.pickLists.filter((x) => !state.known[x.id]) : [];
      state.lists = d.pickLists;
      state.known = {}; d.pickLists.forEach((x) => { state.known[x.id] = 1; });
      // forget ticks of pick lists that are no longer shown (older than 7 days)
      Object.keys(picked).forEach((k) => { if (!state.known[k.split('|')[0]]) delete picked[k]; });
      savePicked();
      if (fresh.length) { say('New pick list: ' + fresh[0].orders + (fresh[0].orders === 1 ? ' order' : ' orders') + ', ' + fresh[0].products + (fresh[0].products === 1 ? ' product' : ' products') + '.', 'ok'); beep(); }
      else if (!quiet) {
        const open = d.pickLists.filter((x) => !x.done).length;
        say(open ? 'Tap a pick list to open it.' : d.pickLists.length ? 'Every pick list is finished.' : 'No pick lists in the last 7 days.', open ? 'ok' : '');
      }
      renderLists(fresh);
    } catch (e) { if (!quiet) say(e.message, 'bad'); }
  }

  function renderLists(fresh) {
    const box = $('lists'); box.innerHTML = '';
    const isNew = {}; (fresh || []).forEach((x) => { isNew[x.id] = 1; });
    // finished pick lists are hidden, unless "Show finished" is on
    const nFin = state.lists.filter((x) => x.done).length, btn = $('showDoneBtn');
    btn.hidden = !nFin;
    btn.textContent = state.showDone ? 'Hide finished pick lists' : 'Show finished pick lists (' + nFin + ')';
    state.lists.filter((x) => !x.done || state.showDone).forEach(function (x) {
      const done = doneCount(x.id);
      const b = document.createElement('button');
      b.className = 'pl' + (isNew[x.id] ? ' new' : '') + (done && done >= x.products ? ' done' : '') + (x.done ? ' fin' : '');
      b.innerHTML = '<div><div class="a"></div><div class="b"></div></div><div class="q"><b></b><span></span></div>';
      b.querySelector('.a').textContent = fmt(x.createdAt);
      const tag = document.createElement('span'); tag.className = 'tag' + (x.kind === 'manual' ? ' m' : ''); tag.textContent = x.kind === 'manual' ? 'Manual' : 'Automatic';
      b.querySelector('.a').appendChild(tag);
      if (x.done) { const f = document.createElement('span'); f.className = 'tag f'; f.textContent = 'Finished'; b.querySelector('.a').appendChild(f); }
      b.querySelector('.b').textContent = x.orders + (x.orders === 1 ? ' order' : ' orders') + ' · ' + x.products + (x.products === 1 ? ' product' : ' products');
      b.querySelector('.q b').textContent = done + '/' + x.products;
      b.querySelector('.q span').textContent = 'picked';
      b.addEventListener('click', function () { openList(x.id); });
      box.appendChild(b);
    });
  }

  async function openList(id) {
    if (state.busy) return;
    state.busy = true;
    say('Loading pick list...');
    try {
      const d = await api({ action: 'getPickList', id: id });
      state.current = d.pickList;
      $('lists').hidden = true; $('showDoneBtn').hidden = true; $('detail').hidden = false; $('createBtn').parentNode.hidden = true;
      say('Sorted by bin location. Tap a line when it is picked.', 'ok');
      render();
      window.scrollTo(0, 0);
    } catch (e) { say(e.message, 'bad'); }
    finally { state.busy = false; }
  }
  function closeList() {
    state.current = null;
    $('detail').hidden = true; $('lists').hidden = false; $('createBtn').parentNode.hidden = false;
    renderLists(); say('Tap a pick list to open it.');
  }

  async function createNow() {
    if (state.busy) return;
    if (!await pfConfirm(T('Create a pick list now with the new orders that qualify?'), { title: 'Pick list', ok: 'Create' })) return;
    state.busy = true; $('createBtn').disabled = true;
    say('Creating pick list...');
    let made = null;
    try {
      const d = await api({ action: 'createPickList' });
      if (!d.created) say('No new orders to pick: every qualifying order is already on a pick list.', '');
      else { made = d.pickList; made.truncated = d.truncated; state.known = state.known || {}; state.known[made.id] = 1; }
    } catch (e) { say(e.message, 'bad'); }
    finally { state.busy = false; $('createBtn').disabled = false; }
    if (made) {   // open the new list once the create step is finished
      await loadLists(true);
      await openList(made.id);
      say('Pick list created: ' + made.orders + (made.orders === 1 ? ' order' : ' orders') + ', ' + made.products + (made.products === 1 ? ' product' : ' products') + '.' +
        (made.truncated ? '\nMore than 1000 orders are waiting: create another pick list for the rest.' : ''), 'ok');
    }
  }

  let actx;
  function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.value = 0.15; o.start(); o.stop(actx.currentTime + 0.25); } catch (e) {}
    if (navigator.vibrate) try { navigator.vibrate([80, 60, 80]); } catch (e) {} }

  // ---------- one pick list ----------
  function render() {
    if (!state.current) return;
    const c = state.current, ps = c.items, units = ps.reduce((s, p) => s + p.quantity, 0);
    const done = ps.filter((p) => picked[pickKey(p)]).length;
    $('plName').textContent = fmt(c.createdAt);
    $('finishBtn').textContent = c.done ? 'Open again' : '✓ Finished';
    $('finishBtn').className = c.done ? 'reopen' : 'finish';
    $('genAt').textContent = '';
    $('sumText').textContent = c.orders + (c.orders === 1 ? ' order' : ' orders') + ' · ' + ps.length + (ps.length === 1 ? ' product' : ' products') + ' · ' + units + ' units';
    $('pickedText').textContent = ps.length ? 'Picked ' + done + ' of ' + ps.length : '';
    // which of this list's orders are already fulfilled (tap an order to open it in Fulfill)
    const st = c.orderStatus || {}, names = Object.keys(st);
    $('fulfilledLine').textContent = names.length ? 'Orders fulfilled: ' + names.filter((n) => st[n] === 'FULFILLED').length + ' of ' + names.length + ' · tap an order to fulfill it' : '';
    $('bar').style.width = ps.length ? Math.round(done / ps.length * 100) + '%' : '0';
    $('printSub').textContent = $('sumText').textContent + ' · ' + fmt(c.createdAt);
    const list = $('list');
    list.innerHTML = '';
    const hide = $('hidePicked').checked;
    ps.forEach(function (p, idx) {
      const isPicked = !!picked[pickKey(p)];
      if (hide && isPicked) return;
      const el = document.createElement('div');
      el.className = 'row' + (isPicked ? ' picked' : '');
      el.dataset.i = idx;
      el.innerHTML = '<div class="tick">' + (isPicked ? '✓' : '') + '</div>' +
        (p.image ? '<img loading="lazy" src="' + String(p.image).replace(/"/g, '') + '" alt="">' : '<div class="noimg"></div>') +
        '<div><div class="t" data-no-i18n></div><div class="m"></div><div class="bins"></div><div class="ords"></div></div>' +
        '<div class="qty"><b></b><small>pcs</small></div>';
      el.querySelector('.t').textContent = p.variantName ? p.title + ' - ' + p.variantName : p.title;
      const sku = document.createElement('span'); sku.dir = 'ltr'; sku.setAttribute('data-no-i18n', ''); sku.textContent = p.sku ? 'SKU ' + p.sku : '';
      el.querySelector('.m').appendChild(sku);
      [['Variant bin:', p.variantBin], ['Product bin:', p.productBin]].forEach(function (b) {
        if (!b[1]) return;
        const w = document.createElement('div'), l = document.createElement('span'), v = document.createElement('b');
        l.textContent = b[0] + ' '; v.textContent = b[1]; v.dir = 'ltr'; v.setAttribute('data-no-i18n', '');
        w.appendChild(l); w.appendChild(v); el.querySelector('.bins').appendChild(w);
      });
      p.orders.forEach(function (name) {
        const b = document.createElement('button'), done = (c.orderStatus || {})[name] === 'FULFILLED';
        b.className = done ? 'ok' : ''; b.dataset.order = name; b.dir = 'ltr'; b.setAttribute('data-no-i18n', '');
        b.textContent = (done ? '✓ ' : '') + name;
        el.querySelector('.ords').appendChild(b);
      });
      el.querySelector('.qty b').textContent = p.quantity;
      list.appendChild(el);
    });
  }

  $('list').addEventListener('click', function (e) {
    const ob = e.target.closest('button[data-order]');
    if (ob) {   // open this order in the Orders tab (Fulfill); the main page switches tabs
      e.stopPropagation();
      if (window.parent !== window) window.parent.postMessage({ type: 'pf-open-order', order: ob.dataset.order }, location.origin);
      return;
    }
    const row = e.target.closest('.row');
    if (!row) return;
    const p = state.current.items[+row.dataset.i], k = pickKey(p);
    if (picked[k]) delete picked[k]; else picked[k] = 1;
    savePicked();
    render();
  });
  $('hidePicked').addEventListener('change', render);
  $('refreshBtn').addEventListener('click', function () { loadLists(); });
  $('createBtn').addEventListener('click', createNow);
  $('backBtn').addEventListener('click', closeList);
  // finished: hidden from the list on every phone (saved on the server); "Open again" undoes it
  $('finishBtn').addEventListener('click', async function () {
    const c = state.current;
    if (!c || state.busy) return;
    const done = !c.done;
    if (done && !await pfConfirm(T('Mark this pick list as finished? It will be hidden from the list.'), { title: 'Pick list', ok: '✓ Finished' })) return;
    state.busy = true; $('finishBtn').disabled = true;
    try {
      await api({ action: 'setPickListDone', id: c.id, done: done });
      c.done = done;
      state.lists.forEach((x) => { if (x.id === c.id) x.done = done; });
      if (done) { state.busy = false; closeList(); say('Pick list finished and hidden.', 'ok'); }
      else { render(); say('Pick list opened again.', 'ok'); }
    } catch (e) { say(e.message, 'bad'); }
    finally { state.busy = false; $('finishBtn').disabled = false; }
  });
  $('showDoneBtn').addEventListener('click', function () { state.showDone = !state.showDone; renderLists(); });
  $('printBtn').addEventListener('click', function () { window.print(); });
  document.addEventListener('pf-lang', function () { if (state.current) render(); else renderLists(); });
  // back on this tab (e.g. after fulfilling an order): refresh the open list's order status quietly
  // (a tab hidden inside the app still counts as visible to the browser, so the main page tells us)
  let shown = true;
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    if (e.data === 'pf-hide') { shown = false; return; }
    if (e.data === 'pf-show') { shown = true; if (!state.current) loadLists(true); }
    if (e.data !== 'pf-show' || !state.current || state.busy) return;
    api({ action: 'getPickList', id: state.current.id }).then(function (d) { if (state.current && d.pickList.id === state.current.id) { state.current = d.pickList; render(); } }).catch(function () {});
  });
  // while this screen is open, look for new pick lists every minute
  setInterval(function () { if (shown && store.get('appKey') && !document.hidden) loadLists(true); }, 60000);

  async function openSettings() {
    const v = await pfSettings({ title: 'Settings', fields: [{ key: 'appKey', label: 'Orders pass', hint: 'The same pass opens Orders, Check, Purchase orders, Pick list and Today.', secret: true, value: store.get('appKey') }] });
    if (!v) return;
    store.set('appKey', v.appKey);
    if (v.appKey) loadLists();
  }
  $('settingsBtn').addEventListener('click', openSettings);

  if (store.get('appKey')) loadLists(); else say('Open Settings and enter the Orders pass.', 'bad');
})();
</script>
</body>
